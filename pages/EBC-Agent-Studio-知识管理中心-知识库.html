<!--
===============================================================================
前端开发交接说明
===============================================================================
原型版本：EBC Agent Studio Knowledge Prototype v2.1（单文件交付）
页面入口：
  1. /pages/EBC-Agent-Studio-知识管理中心-知识库.html
  2. /pages/EBC-Agent-Studio-知识管理中心-知识库.html?prototypeShell=1
  3. /prototype-shell.html#knowledge

页面视图：
  知识库列表；知识库详情；知识文档；已关联数据源；导入任务；
  五步文档导入；文档详情与切片；RAG 召回测试；测试历史；
  三组配置对比；知识库设置。

核心流程：
  已连接文件数据源 -> 浏览目录 -> 明确选择文件 -> 配置文档属性和同步规则
  -> 配置解析与切分 -> 容量和风险确认 -> 创建导入任务
  -> 读取源文件 -> 解析 -> 切分 -> 建立索引 -> 导入完成。

核心数据实体：
  knowledgeBases, connectedSources, sourceDirectories, sourceFiles,
  sourceBindings, importTasks, categories, documents, chunks,
  retrievalHistory, knowledgeBaseSettings。

状态枚举：
  导入任务状态；导入处理阶段；文档处理状态；文档启用状态；
  文件导入状态；数据源访问状态；切片索引状态。
  每个状态集中定义 value、label、type、description、allowedActions。
  文档处理状态（触发：导入/重新处理/切片变更；终态：导入完成、处理失败、已过期、超量失效——以 catalog 字典为准）。
  导入任务状态（触发：创建/自动推进/取消/重试；终态：导入完成、部分成功、处理失败、已取消）。
  切片索引状态（触发：切分/编辑/重建；终态：索引已建立、索引失败、内容异常）。
  切分支持自动/通用/父子分段三档，父子分段使用父/子双分隔符。
  状态字典按 value 扁平索引，跨域重名值（如 等待处理/导入完成/处理失败）会互相覆盖，消费方须传 domains 过滤。

localStorage key：
  ebcAgentStudio.knowledgePrototype.v2
  只通过 loadPrototypeState、savePrototypeState、migratePrototypeState、
  resetPrototypeState 访问。旧版本状态会自动迁移，不兼容数据安全恢复初始值。

主要交互规则：
  使用统一事件代理和 data-action，不使用分散 onclick。
  文档处理状态与启用状态彼此独立。
  同步范围只包含用户明确选择的文件，跨目录保留选择。
  删除知识库、关联、文档、分类和切片必须二次确认。
  Esc 按 菜单 > 弹窗 > 抽屉 > 向导 顺序关闭最上层；向导未保存时先弹放弃确认。
  提交类操作（向导确认、保存设置、新建知识库、文档/切片保存）用 state.submitting 防重复提交。
  权限不足或状态不允许的操作一律禁用并提示，不隐藏入口。
  hashchange 直接清空向导不弹确认（已知简化：路由已变，仅 goto-data-sources 走确认流程）。
  Toast 只负责结果反馈，页面、抽屉、弹窗、任务和数据变化承载操作结果。
  1440×900 下核心区域不得产生横向溢出。

P1 未实现：
  知识图谱，仅保留明确标记为“规划中”的入口。

本期不处理：
  空文件（0 字节）；超大切片量的分页渲染；并发导入任务上限；
  操作级权限细化（本期一律 禁用+提示，不隐藏入口）。

数据字典（关键字段）：
  knowledgeBases[].settings.defaultChunk：枚举 自动切分/通用切分/父子分段；
    旧值“自定义切分”按“通用切分”兼容（读取时映射，不落库改写）。
  导入向导 chunk：mode 三档同上；length 200–4000 默认 1000（通用切分）；
    overlap 0–1000 默认 100，不超对应分段长度 30%；
    childLength 200–1000 默认 512（父子分段）；
    parentLength 1024–4000 默认 2048，须大于子分段长度；
    separator 默认 \n\n；childSeparator 默认 。（仅父子分段）；
    ocr/table/headings/blankFilter/headerFilter 布尔默认 true。
  可编辑规则：向量模型在已有文档/切片后锁定不可改（UI 禁用）。
  importTasks[].importedStrategy 三值枚举：
    重新解析并建立索引/更新文档属性但不重新处理/跳过。
  documents[].scope 四值枚举：不生效/仅调试/仅发布/调试和发布均生效。

变更记录：
  v2.1 —— 切分方式三档（自动/通用/父子分段）与父子分段双分隔符；
    设置抽屉“知识处理模型”改名“模型选型”；默认切分策略下拉回显修复；
    审计修复 A1–A14（默认标签类型兜底、管理同步范围锁定数据源、召回筛选回显、
    行内查看/切片操作状态禁用、清空级联清理、确认页转义、对比文案与校验、
    取消任务关联刷新、文档不存在提示、向导丢弃确认、钳制回显、死分支清理、
    任务关联计数同步）；交付补强 B1–B6（五态补齐、Esc 与防重提、文案格式统一、
    数据字典、状态机说明、边界声明）。

真实后端对接替换区域：
  已连接数据源列表与目录读取；文件下载；导入任务调度；文档解析与切分；
  OCR 与表格解析；向量化和索引；RAG 召回；容量配额；权限校验。
  禁止在知识库页面保存用户名、密码、Token、AccessKey 或 SecretKey。
===============================================================================
-->

    const conflicting = files.find(file=>db.importTasks.some(task=>task.kbId===kbId&&ACTIVE_TASK_STAGES.has(task.stage)&&task.files.some(taskFile=>taskFile.fileId===file.id)));
    if(conflicting) return {ok:false, reason:'FILE_TASK_CONFLICT', message:`文件「${conflicting.name}」已有任务正在处理中，请等待完成或取消原任务后重试`, file:conflicting};
    const netAdd = estimateImportSize(kbId, files, options.importedStrategy || '重新解析并建立索引');
    if(netAdd > 0 && usedOf(kbId) + netAdd > kb.capacityBytes) return {ok:false, reason:'CAPACITY_EXCEEDED', message:'当前知识库容量仍不足，请清理文档或申请扩容', netAdd};
    return {ok:true, files, netAdd};
  }

  function recallCategoryOptions(kbIds){
    const multi = (kbIds||[]).length > 1;
    return db.categories.filter(cat=>(kbIds||[]).includes(cat.kbId)).map(cat=>({ id:cat.id, label: multi ? `${kbOf(cat.kbId)?.name||''} / ${cat.name}` : cat.name }));
  }

  function deriveKnowledgeBaseStatus(kbId) {
    const kb=kbOf(kbId);if(!kb)return;
    const used=usedOf(kbId),capacity=kb.capacityBytes||1;
    const assocs=associationsOf(kbId);
    if(used>=capacity)kb.status='容量已满';
    else if(assocs.some(assoc=>assoc.lastResult==='同步失败'||assoc.lastResult==='部分成功'))kb.status='同步异常';
    else if(used>=capacity*0.9)kb.status='容量预警';
    else if(kb.lastSyncAt&&kb.lastSyncAt!=='-'&&parseTime(kb.lastSyncAt)<startOfDaysAgo(30).getTime())kb.status='长期未同步';
    else if(!docsOf(kbId).length)kb.status='暂无内容';
    else kb.status='正常';
  }

  function syncKnowledgeBaseState(kbId) {
    const kb=kbOf(kbId);if(!kb)return;
    if(!docsOf(kbId).length)kb.lastSyncAt='-';
    deriveKnowledgeBaseStatus(kbId);
  }

  function enhanceAccessibility(root) {
    const actionLabels={
      'close-wizard':'关闭同步导入', 'remove-wizard-file':'移除已选文件',
      'task-menu':'任务更多操作', 'columns':'列显示设置', 'compare-toggle-rerank':'结果重排序'
    };
    $$('button',root).forEach(button=>{
      let label=button.getAttribute('aria-label')||button.getAttribute('title')||button.textContent.trim();
      if(button.classList.contains('switch')){
        const field=button.previousElementSibling?.textContent?.trim()||actionLabels[button.dataset.action]||'此项设置';
        label=`${button.classList.contains('on')?'关闭':'启用'}${field}`;
      }
      label=label||actionLabels[button.dataset.action]||'操作';
      if(!button.getAttribute('aria-label'))button.setAttribute('aria-label',label);
      if((button.classList.contains('icon-btn')||button.classList.contains('switch')||button.classList.contains('page-btn'))&&!button.getAttribute('title'))button.setAttribute('title',label);
    });
    $$('input[type="checkbox"]',root).forEach(input=>{
      const file=input.dataset.id?db.sourceFiles.find(item=>item.id===input.dataset.id):null;
      const reason=file?fileDisabledReason(file):'';

      if(!input.getAttribute('title'))input.setAttribute('title',reason||label);
    });

  function categoryRows(kbId) {
    const categories=db.categories.filter(item=>item.kbId===kbId);
    const result=[];
    const visited=new Set();
    function add(parentId,level){categories.filter(item=>item.parentId===parentId).forEach(item=>{if(visited.has(item.id))return;visited.add(item.id);result.push({...item,level});add(item.id,level+1);});}
    add(null,0); return result;
  }
  function categoryDescendantIds(kbId, categoryId) {
    const categories=db.categories.filter(item=>item.kbId===kbId);
    const result=new Set(); const queue=[categoryId]; const visited=new Set([categoryId]);
    while(queue.length){ const current=queue.shift(); categories.filter(item=>item.parentId===current).forEach(item=>{ if(visited.has(item.id))return; visited.add(item.id); result.add(item.id); queue.push(item.id); }); }
    return result;
  }

-id="${doc.id}" ${isDocActionAllowed(doc,doc.enabled?'停用':'启用')?'':'disabled'} title="${doc.enabled?'停用':'启用'}文档" aria-label="${doc.enabled?'停用':'启用'}文档 ${esc(doc.name)}"></button><div class="cell-sub">${doc.enabled?'已启用':'已停用'}</div></td>`:''}${has('scope')?`<td><div class="truncate" title="${esc(doc.scope)}">${esc(doc.scope)}</div></td>`:''}${has('updated')?`<td><div class="truncate" title="${esc(doc.lastSyncAt||'-')}">${esc(doc.lastSyncAt||'-')}</div></td>`:''}${has('actions')?`<td><div class="inline-actions"><button class="link" data-action="open-doc" data-id="${doc.id}" ${isDocActionAllowed(doc,'查看')?'':'disabled title="当前状态不支持该操作"'}>详情</button><button class="btn ghost icon-btn small" data-action="doc-menu" data-id="${doc.id}" title="${esc(doc.name)}更多操作" aria-label="${esc(doc.name)}更多操作">${icon('more')}</button></div></td>`:''}</tr>`}).join('')}</tbody></table>`;
  }

  function renderAssociations(kb) {
    const rows=associationsOf(kb.id);
    return `<section class="panel"><div class="toolbar compact"><div><b>已关联数据源</b><div class="cell-sub">只管理知识库与已连接文件数据源的同步关系，不修改底层连接。</div></div><span class="push"></span><button class="btn" data-action="goto-data-sources">${icon('link')}文件数据源模块</button><button class="btn primary" data-action="start-import">${icon('plus')}增加同步文档</button></div><div class="table-scroll">${rows.length?`<table class="data-table"><colgroup><col style="width:19%"><col style="width:9%"><col style="width:10%"><col style="width:9%"><col style="width:12%"><col style="width:9%"><col style="width:13%"><col style="width:19%"></colgroup><thead><tr><th>数据源</th><th>类型</th><th>选择 / 成功</th><th>失败</th><th>同步方式</th><th>自动同步</th><th>最近 / 下次同步</th><th>操作</th></tr></thead><tbody>${rows.map(assoc=>{const source=sourceOf(assoc.sourceId);return `<tr><td><div class="cell-main" title="${esc(source?.name||'-')}">${esc(source?.name||'-')}</div><div class="cell-sub" title="${esc(source?.description||'')}">${esc(source?.description||'')}</div></td><td>${esc(source?.type||'-')}</td><td>${assoc.fileIds.length} / ${assoc.successCount}</td><td>${assoc.failedCount?`<button class="link danger" data-action="assoc-failures" data-id="${assoc.id}">${assoc.failedCount}</button>`:'0'}</td><td>${esc(assoc.syncMode)}</td><td><button class="switch ${assoc.autoSync?'on':''}" data-action="toggle-auto-sync" data-id="${assoc.id}" title="${assoc.autoSync?'停用':'启用'}自动同步" aria-label="${assoc.autoSync?'停用':'启用'}${esc(source?.name||'数据源')}自动同步"></button><div class="cell-sub">${assoc.autoSync?'已启用':'已停用'}</div></td><td>${badge(assoc.lastResult)}<div class="cell-sub" title="最近同步 ${esc(assoc.lastSyncAt)}；下次同步 ${esc(assoc.nextSyncAt)}">${esc(assoc.lastSyncAt)} / ${esc(assoc.nextSyncAt)}</div></td><td><div class="inline-actions"><button class="link" data-action="view-assoc-files" data-id="${assoc.id}">已选文档</button><button class="link" data-action="manage-scope" data-id="${assoc.id}">管理范围</button><button class="btn ghost icon-btn small" data-action="assoc-menu" data-id="${assoc.id}" title="${esc(source?.name||'数据源')}更多操作" aria-label="${esc(source?.name||'数据源')}更多操作">${icon('more')}</button></div></td></tr>`}).join('')}</tbody></table>`:renderState('link','尚未关联文件数据源','从已连接文件数据源选择具体文档后，关联关系会显示在这里。','从文件数据源导入','start-import')}</div></section>`;
  }
  function renderTasks(kb) {
    let rows=tasksOf(kb.id); if(state.taskStatus!=='all')rows=rows.filter(item=>item.stage===state.taskStatus);if(state.taskSource!=='all')rows=rows.filter(item=>item.sourceId===state.taskSource);
    if(state.taskTime!=='all'){const taskLimit=(state.taskTime==='today'?startOfToday():startOfMonth()).getTime();rows=rows.filter(item=>parseTime(item.startedAt)>=taskLimit);}
    const taskSourceIds=[...new Set(tasksOf(kb.id).map(task=>task.sourceId))];
    return `<section class="panel"><div class="toolbar compact"><select class="select" data-change="task-status"><option value="all">全部任务状态</option>${['等待处理','读取源文件','解析中','切分中','建立索引中','导入完成','部分成功','处理失败','已取消','已暂停','权限不足','来源不可访问','超出容量'].map(value=>`<option ${state.taskStatus===value?'selected':''}>${value}</option>`).join('')}</select><select class="select" data-change="task-source"><option value="all">全部数据源</option>${taskSourceIds.map(sourceId=>{const source=sourceOf(sourceId);return `<option value="${sourceId}" ${state.taskSource===sourceId?'selected':''}>${esc(source?.name||'-')}</option>`}).join('')}</select><select class="select" data-change="task-time"><option value="all">全部时间</option><option value="today" ${state.taskTime==='today'?'selected':''}>今天</option><option value="month" ${state.taskTime==='month'?'selected':''}>本月</option></select><span class="push"></span><button class="btn primary" data-action="start-import">${icon('upload')}新建导入任务</button></div><div class="table-scroll">${rows.length?`<table class="data-table"><colgroup><col style="width:135px"><col style="width:16%"><col style="width:9%"><col style="width:12%"><col style="width:14%"><col style="width:14%"><col style="width:100px"></colgroup><thead><tr><th>任务 ID</th><th>来源 / 方式</th><th>文件统计</th><th>当前阶段</th><th>整体进度</th><th>开始 / 完成</th><th>操作</th></tr></thead><tbody>${rows.map(task=>{const source=sourceOf(task.sourceId);return `<tr><td><button class="name-link" data-action="task-detail" data-id="${task.id}">${esc(task.id)}</button><div class="cell-sub">操作人 ${esc(task.operator)}</div></td><td><div class="cell-main" title="${esc(source?.name||'-')}">${esc(source?.name||'-')}</div><div class="cell-sub" title="${esc(task.mode)}">${esc(task.mode)}</div></td><td>共 ${task.total}<div class="cell-sub">新增 ${task.added} · 更新 ${task.updated} · 跳过 ${task.skipped} · 失败 ${task.failed}</div></td><td>${badge(task.stage)}</td><td><div class="progress ${task.stage.includes('失败')?'error':''}"><span style="width:${task.progress}%"></span></div><div class="cell-sub">${task.progress}%</div></td><td>${esc(task.startedAt)}<div class="cell-sub">${esc(task.completedAt||'处理中')}</div></td><td><div class="inline-actions"><button class="link" data-action="task-detail" data-id="${task.id}">详情</button><button class="btn ghost icon-btn small" data-action="task-menu" data-id="${task.id}">${icon('more')}</button></div></td></tr>`}).join('')}</tbody></table>`:renderState('file','暂无任务记录','完成一次文档同步导入后，处理链路会显示在这里。','新建导入任务','start-import')}</div></section>`;
  }

  function modalShell(title,body,confirmText='保存',confirmAction,wide=false,danger=false,cancelText='取消') {
    return `<div class="modal-mask" data-action="close-modal"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}" data-stop><header class="modal-head"><h3>${esc(title)}</h3><button class="btn ghost icon-btn" data-action="close-modal" title="关闭${esc(title)}" aria-label="关闭${esc(title)}">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-foot"><button class="btn" data-action="close-modal">${esc(cancelText)}</button><button class="btn ${danger?'danger fill':'primary'}" data-action="${confirmAction}">${esc(confirmText)}</button></footer></section></div>`;
  }
  function renderModal() {
    const modal=state.modal;if(!modal)return '';
    if(modal.type==='new-kb') return modalShell('新建知识库',`<div class="field-grid"><div class="field full"><label>知识库名称 <span class="required">*</span></label><input class="input" maxlength="40" data-modal-field="name" value="${esc(modal.name||'')}"><div class="field-help">1–40 个字符</div>${modal.errors?.name?`<div class="field-error">${esc(modal.errors.name)}</div>`:''}</div><div class="field full"><label>知识库描述</label><textarea class="textarea" maxlength="200" data-modal-field="description">${esc(modal.description||'')}</textarea><div class="field-help">最多 200 个字符</div></div><div class="field"><label>容量</label><select class="select" data-modal-field="capacity"><option value="536870912">500 MB</option><option value="1073741824">1 GB</option><option value="2147483648">2 GB</option></select></div><div class="field"><label>标识</label><input class="input" maxlength="2" data-modal-field="mark" value="${esc(modal.mark||'')}"></div></div>`,'创建','modal-create-kb');
    if(modal.type==='delete-kb'){
      const kb=kbOf(modal.kbId),apps=kb?.apps||[];
      return modalShell('删除知识库',`${apps.length?`<div class="warning-box">${icon('warning')}<div><b>该知识库正在被 ${apps.length} 个应用引用</b><div>${esc(apps.join('、'))}</div><div>删除后，这些应用将无法继续召回该知识库中的内容。</div></div></div>`:''}<div class="confirm-name">确定删除「${esc(kb?.name||'')}」？</div><p class="muted">知识文档、切片、同步关系、任务与召回历史将一并删除，且无法撤销。</p><label class="checkbox"><input type="checkbox" data-modal-field="confirmed" ${modal.confirmed?'checked':''}>我已了解影响并确认删除</label>${modal.error?`<div class="field-error">${esc(modal.error)}</div>`:''}`,'删除知识库','modal-delete-kb',false,true);
    }
    if(modal.type==='category-form'){
      const title=modal.mode==='rename'?'重命名分类':modal.mode==='move'?'移动分类':modal.parentId?'新增子分类':'新增分类';
      const nameField=modal.mode==='move'?'':`<div class="field"><label>分类名称 <span class="required">*</span></label><input class="input" maxlength="30" data-modal-field="name" value="${esc(modal.name||'')}"><div class="field-help">最多 30 个字符，同级分类不可重名。</div></div>`;
      return modalShell(title,`${nameField}${modal.mode==='move'?`<div class="field"><label>移动到</label><select class="select" data-modal-field="parentId"><option value="">顶级分类</option>${categoryRows(modal.kbId).filter(item=>item.id!==modal.categoryId&&!categoryDescendantIds(modal.kbId,modal.categoryId).has(item.id)).map(item=>`<option value="${item.id}" ${item.id===modal.parentId?'selected':''}>${'　'.repeat(item.level)}${esc(item.name)}</option>`).join('')}</select></div>`:''}${modal.error?`<div class="field-error">${esc(modal.error)}</div>`:''}`,'保存','modal-save-category');
    }
    if(modal.type==='delete-category'){
      const category=categoryOf(modal.categoryId),count=db.documents.filter(doc=>doc.categoryId===modal.categoryId).length;
      return modalShell('删除分类',`${count?`<div class="warning-box">${icon('warning')}<div>分类「${esc(category?.name||'')}」中有 ${count} 个文档。删除后，这些文档将移动至“未分类”。</div></div>`:`<p>确定删除空分类「${esc(category?.name||'')}」？</p>`}<label class="checkbox"><input type="checkbox" data-modal-field="confirmed" ${modal.confirmed?'checked':''}>确认删除分类${count?'并移动其中的文档':''}</label>${modal.error?`<div class="field-error">${esc(modal.error)}</div>`:''}`,'删除分类','modal-delete-category',false,true);
    }
    if(modal.type==='columns'){
      const options=[['name','文档'],['source','来源数据源'],['category','分类'],['processing','处理状态'],['enabled','启用状态'],['scope','生效范围'],['updated','最近同步'],['actions','操作']];
      return modalShell('列显示设置',`<div class="option-stack">${options.map(([key,label])=>`<label class="checkbox"><input type="checkbox" data-column="${key}" ${state.columns.includes(key)?'checked':''} ${key==='name'||key==='actions'?'disabled':''}>${label}${key==='name'||key==='actions'?'<span class="muted">（固定显示）</span>':''}</label>`).join('')}</div>`,'完成','close-modal');
    }
    if(modal.type==='more-doc-filters'){
      const types=[...new Set(docsOf(modal.kbId).map(doc=>doc.type).filter(Boolean))];
      return modalShell('更多筛选',`<div class="field-grid"><div class="field"><label>启用状态</label><select class="select" data-modal-field="docEnabled"><option value="all">全部启用状态</option><option value="true" ${modal.docEnabled==='true'?'selected':''}>已启用</option><option value="false" ${modal.docEnabled==='false'?'selected':''}>已停用</option></select></div><div class="field"><label>生效范围</label><select class="select" data-modal-field="docScope"><option value="all">全部生效范围</option>${['不生效','仅调试','仅发布','调试和发布均生效'].map(value=>`<option value="${value}" ${modal.docScope===value?'selected':''}>${value}</option>`).join('')}</select></div><div class="field"><label>更新时间</label><select class="select" data-modal-field="docUpdated"><option value="all">全部更新时间</option><option value="7" ${modal.docUpdated==='7'?'selected':''}>近 7 天</option><option value="30" ${modal.docUpdated==='30'?'selected':''}>近 30 天</option></select></div><div class="field"><label>到期状态</label><select class="select" data-modal-field="docExpiry"><option value="all">全部到期状态</option><option value="active" ${modal.docExpiry==='active'?'selected':''}>有效</option><option value="expired" ${modal.docExpiry==='expired'?'selected':''}>已过期</option></select></div><div class="field"><label>文件格式</label><select class="select" data-modal-field="docType"><option value="all">全部格式</option>${types.map(value=>`<option value="${value}" ${modal.docType===value?'selected':''}>${value}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:16px"><button class="btn" data-action="clear-more-filters">清空筛选</button></div>`,'应用筛选','apply-more-filters');
    }
    if(modal.type==='batch'){
      let body='';
      if(modal.action==='category')body=renderCategorySelect(modal.kbId,'value',modal.value||'');
      if(modal.action==='tags')body=`<div class="field"><label>文档标签</label><input class="input" data-modal-field="value" value="${esc(modal.value||'')}" placeholder="多个标签用逗号分隔"><div class="field-help">将覆盖已选文档的标签。</div></div>`;
      if(modal.action==='expiry')body=`<div class="field"><label>到期时间</label><input class="input" type="date" data-modal-field="value" value="${esc(modal.value||'')}"><div class="field-help">留空表示长期有效。</div></div>`;
      if(modal.action==='scope')body=`<div class="field"><label>生效范围</label><select class="select" data-modal-field="value">${['不生效','仅调试','仅发布','调试和发布均生效'].map(item=>`<option ${modal.value===item?'selected':''}>${item}</option>`).join('')}</select></div>`;
      return modalShell(modal.title,body,'应用到 '+state.selectedDocs.length+' 个文档','modal-apply-batch');
    }
    if(modal.type==='delete-docs') return modalShell('删除文档',`<div class="warning-box">${icon('warning')}<div>将删除 ${modal.docIds.length} 个文档及其切片，但不会删除文件数据源中的原始文件。</div></div><label class="checkbox"><input type="checkbox" data-modal-field="confirmed" ${modal.confirmed?'checked':''}>确认从知识库中删除</label>${modal.error?`<div class="field-error">${esc(modal.error)}</div>`:''}`,'删除文档','modal-delete-docs',false,true);
    if(modal.type==='rename-doc'){
      const doc=db.documents.find(item=>item.id===modal.docId);
      return modalShell('重命名文档',`<div class="field"><label>文档名称 <span class="required">*</span></label><input class="input" maxlength="120" data-modal-field="name" value="${esc(modal.name??doc?.name??'')}">${modal.error?`<div class="field-error">${esc(modal.error)}</div>`:''}</div>`,'保存','modal-rename-doc');
    }
    if(modal.type==='edit-doc'){
      const doc=db.documents.find(item=>item.id===modal.docId);
      return modalShell('编辑文档设置',`<div class="field-grid">${renderCategorySelect(doc.kbId,'categoryId',modal.categoryId??doc.categoryId)}<div class="field"><label>标签</label><input class="input" data-modal-field="tags" value="${esc((modal.tags??doc.tags.join(',')))}"></div><div class="field"><label>生效范围</label><select class="select" data-modal-field="scope">${['不生效','仅调试','仅发布','调试和发布均生效'].map(item=>`<option ${item===(modal.scope??doc.scope)?'selected':''}>${item}</option>`).join('')}</select></div><div class="field"><label>到期时间</label><input class="input" type="date" data-modal-field="expiresAt" value="${esc(modal.expiresAt??doc.expiresAt)}"></div><label class="checkbox"><input type="checkbox" data-modal-field="showReference" ${(modal.showReference??doc.showReference)?'checked':''}>展示参考来源</label><label class="checkbox"><input type="checkbox" data-modal-field="allowDownload" ${(modal.allowDownload??doc.allowDownload)?'checked':''}>允许下载</label></div>`,'保存','modal-save-doc',true);
    }

  function renderCategorySelect(kbId,field,value){const rows=categoryRows(kbId);return `<div class="field"><label>文档分类</label><select class="select" data-modal-field="${field}">${rows.map(item=>`<option value="${item.id}" ${item.id===value?'selected':''}>${'　'.repeat(item.level)}${esc(item.name)}</option>`).join('')}</select></div>`;}

  function renderDrawer() {

  function renderDocDrawer(drawer) {

  function renderAssocFilesDrawer(drawer){const assoc=db.sourceBindings.find(item=>item.id===drawer.assocId);if(!assoc)return '';const source=sourceOf(assoc.sourceId),files=assoc.fileIds.map(id=>db.sourceFiles.find(file=>file.id===id)).filter(Boolean);return drawerShell('已选同步文档',source?.name||'',`<div class="info-box">${icon('info')}同步范围只包含下列已明确选择的文件，不会默认导入整个数据源。</div><table class="data-table"><thead><tr><th>文件</th><th>路径</th><th>状态</th><th>操作</th></tr></thead><tbody>${files.map(file=>`<tr><td><div class="cell-main">${esc(file.name)}</div><div class="cell-sub">${esc(file.type)} · ${bytes(file.sizeBytes)}</div></td><td>${esc(db.sourceDirectories.find(folder=>folder.id===file.folderId)?.path||'-')}</td><td>${badge(file.status)}</td><td><button class="link danger" data-action="remove-scope-file" data-assoc-id="${assoc.id}" data-id="${file.id}">移除范围</button></td></tr>`).join('')}</tbody></table>`,true,`<button class="btn primary" data-action="manage-scope" data-id="${assoc.id}">${icon('plus')}管理同步范围</button>`);}
  function renderAssocFailuresDrawer(drawer){const assoc=db.sourceBindings.find(item=>item.id===drawer.assocId);if(!assoc)return '';const tasks=db.importTasks.filter(item=>item.kbId===assoc.kbId&&item.sourceId===assoc.sourceId);const failed=tasks.flatMap(item=>item.files.filter(file=>file.status==='失败').map(file=>({...file,taskId:item.id})));return drawerShell('同步失败文件',sourceOf(assoc.sourceId)?.name||'',failed.length?`<table class="data-table"><thead><tr><th>失败文件</th><th>失败阶段</th><th>原因与建议</th><th>操作</th></tr></thead><tbody>${failed.map(file=>`<tr><td>${esc(file.name)}</td><td>${esc(file.stage)}</td><td>${esc(file.error||'-')}<div class="cell-sub">${esc(file.suggestion||'修复源文件后重试')}</div></td><td>${isTaskActionAllowed(db.importTasks.find(item=>item.id===file.taskId),'retry-task-file')?`<button class="link" data-action="retry-task-file" data-task-id="${file.taskId}" data-id="${file.fileId}">重试</button>`:'-'}</td></tr>`).join('')}</tbody></table>`:renderState('check','没有失败文件','最近的同步记录均已成功处理。','',''),true);}
  function renderTaskDrawer(drawer){const task=db.importTasks.find(item=>item.id===drawer.taskId);if(!task)return '';const source=sourceOf(task.sourceId);return drawerShell('任务详情 · '+task.id,`${source?.name||'-'} · ${task.mode}`,`<div class="metrics-row"><span class="metric-chip">总数 <b>${task.total}</b></span><span class="metric-chip">新增 <b>${task.added}</b></span><span class="metric-chip">更新 <b>${task.updated}</b></span><span class="metric-chip">跳过 <b>${task.skipped}</b></span><span class="metric-chip">失败 <b>${task.failed}</b></span></div><div class="section" style="margin-top:16px"><div class="section-title">整体进度 ${badge(task.stage)}</div><div class="progress ${task.stage.includes('失败')?'error':''}"><span style="width:${task.progress}%"></span></div><div class="cell-sub">${task.progress}% · ${esc(task.startedAt)} — ${esc(task.completedAt||'处理中')}</div></div><div class="section"><div class="section-title">文件处理进度</div><table class="data-table"><thead><tr><th>文件</th><th>当前阶段</th><th>结果 / 原因</th><th>操作</th></tr></thead><tbody>${task.files.map(file=>`<tr><td>${esc(file.name)}</td><td>${badge(file.stage)}</td><td>${badge(file.status)}${file.error?`<div class="cell-sub" title="${esc(file.error)}">${esc(file.error)} · ${esc(file.suggestion||'')}</div>`:''}</td><td>${file.status==='失败'?`${(isTaskActionAllowed(task,'retry-task-file')?`<button class="link" data-action="retry-task-file" data-task-id="${task.id}" data-id="${file.fileId}">重试</button>`:'')+(isTaskActionAllowed(task,'skip-task-file')?`<button class="link" data-action="skip-task-file" data-task-id="${task.id}" data-id="${file.fileId}">跳过</button>`:'')||'-'}`:'-'}</td></tr>`).join('')}</tbody></table></div>`,true,`${isTaskActionAllowed(task,'rerun-task')?`<button class="btn" data-action="rerun-task" data-id="${task.id}">${icon('refresh')}重新执行任务</button>`:''}${isTaskActionAllowed(task,'cancel-task')?`<button class="btn danger" data-action="cancel-task" data-id="${task.id}">取消任务</button>`:''}`);}

  function renderSettingsDrawer(drawer){const kb=kbOf(drawer.kbId);if(!kb)return '';const draft=drawer.draft||kb;const used=usedOf(kb.id),remaining=Math.max(0,kb.capacityBytes-used),percent=Math.min(100,Math.round(used/kb.capacityBytes*100)),hasDocs=docsOf(kb.id).length>0;let content='';
    if(state.settingsSection==='basic')content=`<div class="field-grid"><div class="field"><label>知识库名称 <span class="required">*</span></label><input class="input" maxlength="40" data-settings-field="name" value="${esc(draft.name)}"></div><div class="field"><label>图标 / 标识</label><input class="input" maxlength="2" data-settings-field="mark" value="${esc(draft.mark)}"></div><div class="field full"><label>知识库描述</label><textarea class="textarea" maxlength="200" data-settings-field="description">${esc(draft.description)}</textarea></div><div class="description-item"><span>创建时间</span><b>${esc(kb.createdAt)}</b></div><div class="description-item"><span>创建人</span><b>${esc(kb.createdBy)}</b></div><div class="description-item"><span>最近更新时间</span><b>${esc(kb.updatedAt)}</b></div><div class="description-item"><span>引用应用</span><b>${esc(kb.apps.join('、')||'暂无')}</b></div></div>`;
    if(state.settingsSection==='capacity')content=`<div class="section"><div class="section-title">容量与用量</div><div class="progress ${percent>=100?'error':''}" style="height:10px"><span style="width:${percent}%"></span></div><div class="description-list" style="margin-top:15px"><div class="description-item"><span>总容量</span><b>${bytes(kb.capacityBytes)}</b></div><div class="description-item"><span>已用容量</span><b>${bytes(used)}</b></div><div class="description-item"><span>剩余容量</span><b>${bytes(remaining)}</b></div><div class="description-item"><span>容量占比</span><b>${percent}% · ${percent>=100?'已超量':'正常'}</b></div><div class="description-item"><span>文档数量</span><b>${docsOf(kb.id).length}</b></div><div class="description-item"><span>切片数量</span><b>${chunksOf(kb.id)}</b></div><div class="description-item"><span>关联数据源</span><b>${associationsOf(kb.id).length}</b></div></div></div>${percent>=90?`<div class="warning-box">${icon('warning')}<div>容量接近或超过上限。建议删除过期文档、缩小同步范围或申请扩容。</div></div>`:`<div class="info-box">${icon('info')}<div>当前容量正常。同步导入前会再次展示预计占用与风险提示。</div></div>`}`;
    if(state.settingsSection==='models')content=`${hasDocs?`<div class="info-box">${icon('info')}<div>知识库已存在文档或切片，为保证向量索引一致性，向量模型已锁定且不可修改。</div></div>`:''}<div class="field-grid"><div class="field"><label>向量模型</label><select class="select" data-settings-model="vectorModel" ${hasDocs?'disabled':''}>${['BAAI/bge-large-zh-v1.5','EBC Embedding Multilingual'].map(item=>`<option ${item===draft.settings.vectorModel?'selected':''}>${item}</option>`).join('')}</select></div><div class="field"><label>文档解析模型</label><select class="select" data-settings-model="parserModel">${['EBC DocParser Pro','EBC DocParser Fast'].map(item=>`<option ${item===draft.settings.parserModel?'selected':''}>${item}</option>`).join('')}</select></div><div class="field"><label>OCR / 图片解析模型</label><select class="select" data-settings-model="ocrModel">${['PaddleOCR Enterprise','EBC Vision OCR'].map(item=>`<option ${item===draft.settings.ocrModel?'selected':''}>${item}</option>`).join('')}</select></div><div class="field"><label>重排序模型</label><select class="select" data-settings-model="rerankModel">${['bge-reranker-v2-m3','EBC Reranker General'].map(item=>`<option ${item===draft.settings.rerankModel?'selected':''}>${item}</option>`).join('')}</select></div></div>`;
    if(state.settingsSection==='defaults')content=`<div class="field-grid">${renderSettingsCategory(kb.id,draft.settings.defaultCategory)}<div class="field"><label>默认标签</label><input class="input" data-settings-default="defaultTags" value="${esc((draft.settings.defaultTags||[]).join(','))}"></div><div class="field"><label>默认到期时间</label><input class="input" type="date" data-settings-default="defaultExpiry" value="${esc(draft.settings.defaultExpiry||'')}"></div><div class="field"><label>默认生效范围</label><select class="select" data-settings-default="defaultScope">${['不生效','仅调试','仅发布','调试和发布均生效'].map(item=>`<option ${item===draft.settings.defaultScope?'selected':''}>${item}</option>`).join('')}</select></div><div class="field"><label>默认切分策略</label><select class="select" data-settings-default="defaultChunk">${['自动切分','通用切分','父子分段'].map(item=>`<option ${item===(draft.settings.defaultChunk==='自定义切分'?'通用切分':draft.settings.defaultChunk)?'selected':''}>${item}</option>`).join('')}</select></div><div class="field"><label>源文件删除处理</label><select class="select" data-settings-default="defaultSourceDelete">${['保留知识库中的文档','停用知识库中的文档','删除知识库中的文档'].map(item=>`<option ${item===draft.settings.defaultSourceDelete?'selected':''}>${item}</option>`).join('')}</select></div><label class="checkbox"><input type="checkbox" data-settings-default="defaultReference" ${draft.settings.defaultReference?'checked':''}>默认展示参考来源</label><label class="checkbox"><input type="checkbox" data-settings-default="defaultDownload" ${draft.settings.defaultDownload?'checked':''}>默认允许下载</label></div>`;
    if(state.settingsSection==='danger')content=`${kb.apps.length?`<div class="warning-box">${icon('warning')}<div>该知识库正在被 ${esc(kb.apps.join('、'))} 引用。清空或删除会影响应用召回。</div></div>`:''}<div class="danger-zone"><div class="danger-row"><div><b>清空知识内容</b><small>保留知识库和设置，删除文档、切片、关联与任务。</small></div><button class="btn danger" data-action="clear-kb" data-id="${kb.id}">清空内容</button></div><div class="danger-row"><div><b>删除知识库</b><small>删除当前知识库及全部本地数据。</small></div><button class="btn danger" data-action="delete-kb" data-id="${kb.id}">删除知识库</button></div></div>`;
    const body=`<div class="settings-nav"><nav class="settings-menu">${[['basic','基础信息'],['capacity','容量与用量'],['models','模型选型'],['defaults','文档默认设置'],['danger','危险操作']].map(([key,label])=>`<button class="${state.settingsSection===key?'active':''}" data-action="settings-section" data-section="${key}">${label}</button>`).join('')}</nav><div class="settings-content">${content}</div></div>`;

  function renderSettingsCategory(kbId,value){return `<div class="field"><label>默认分类</label><select class="select" data-settings-default="defaultCategory">${categoryRows(kbId).map(item=>`<option value="${item.id}" ${item.id===value?'selected':''}>${'　'.repeat(item.level)}${esc(item.name)}</option>`).join('')}</select></div>`;}

  function renderRecallDrawer(drawer){const history=db.retrievalHistory;let body=`<nav class="drawer-tabs">${[['test','召回测试'],['history','测试历史'],['compare','对比测试']].map(([key,label])=>`<button class="${state.recallTab===key?'active':''}" data-action="recall-tab" data-tab="${key}">${label}${key==='history'?` (${history.length})`:''}</button>`).join('')}</nav>`;
    if(state.recallTab==='test')body+=renderRecallTest();

    return drawerShell('RAG 召回测试','配置仅对本次测试生效，不会修改正式检索配置。',body,true);

  function renderRecallTest(){const recall=state.recall;const selected=recall.kbIds;let results=recall.results||[];if(recall.sourceFilter&&recall.sourceFilter!=='all')results=results.filter(item=>item.sourceId===recall.sourceFilter);if(recall.kbFilter&&recall.kbFilter!=='all')results=results.filter(item=>item.kbId===recall.kbFilter);results=[...results].sort((a,b)=>recall.sort==='score'?b.score-a.score:a.rerank-a.rerank);const failedKbs=recall.failedKbIds.map(kbOf).filter(Boolean);const status=recall.executionStatus;const failureNotice=failedKbs.length?`<div class="${status==='全部执行失败'?'error-box':'warning-box'}">${icon('warning')}<div><b>${esc(status)}</b><div>${failedKbs.map(kb=>`${esc(kb.name)}：${esc(kb.unavailableReason||'知识库当前不可用')}`).join('<br>')}</div></div></div>`:'';
    return `<div class="info-box">${icon('info')}<div><b>本次测试配置不会修改正式配置</b><div>测试将依据当前知识库中的文档和切片生成召回结果。</div></div></div><div class="recall-layout"><section class="recall-config"><div class="section"><div class="section-title">选择知识库 <span class="badge blue" style="margin-left:6px">${selected.length} / 10</span></div><div class="kb-picker">${db.knowledgeBases.map(kb=>`<button class="kb-chip ${selected.includes(kb.id)?'selected':''}" data-action="toggle-recall-kb" data-id="${kb.id}" title="${esc(kb.recallAvailable===false?(kb.unavailableReason||'当前不可用'):'可用于召回测试')}">${selected.includes(kb.id)?icon('check'):icon('database')}${esc(kb.name)}${kb.recallAvailable===false?'<span class="badge danger">不可用</span>':''}</button>`).join('')}</div></div><div class="field"><label>测试问题 <span class="required">*</span></label><textarea class="textarea" style="min-height:105px" maxlength="4000" data-bind="recall-question" data-input="recall-question" placeholder="输入要测试的检索问题">${esc(recall.question)}</textarea><div class="field-help">${recall.question.length} / 4000 字</div>${recall.validationError?`<div class="field-error">${esc(recall.validationError)}</div>`:''}</div><div class="field"><label>检索方式</label><div class="segmented">${['混合检索','语义检索','关键词检索'].map(item=>`<button class="${recall.mode===item?'active':''}" data-action="recall-mode" data-value="${item}">${item}</button>`).join('')}</div></div><div class="toggle-line"><span>Excel / 表格检索增强</span><button class="switch ${recall.tableEnhance?'on':''}" data-action="recall-toggle" data-field="tableEnhance"></button></div><div class="toggle-line"><span>启用结果重排序</span><button class="switch ${recall.rerank?'on':''}" data-action="recall-toggle" data-field="rerank"></button></div><div class="field-grid"><div class="field"><label>重排序模型</label><select class="select" data-change="recall-rerank" ${!recall.rerank?'disabled':''}><option>bge-reranker-v2-m3</option><option>EBC Reranker General</option></select></div><div class="field"><label>文档召回数量</label><input class="input" type="number" min="1" max="20" data-change="recall-topk" value="${recall.topK}"></div><div class="field"><label>匹配度阈值</label><input class="input" type="number" min="0" max="1" step="0.01" data-change="recall-threshold" value="${recall.threshold}"></div><div class="field"><label>数据源范围</label><select class="select" data-change="recall-source"><option value="all">全部数据源</option>${db.connectedSources.map(source=>`<option value="${source.id}" ${recall.sourceId===source.id?'selected':''}>${esc(source.name)}</option>`).join('')}</select></div><div class="field"><label>文档分类范围</label><select class="select" data-change="recall-category"><option value="all">全部分类</option>${recallCategoryOptions(selected).map(item=>`<option value="${item.id}" ${recall.categoryId===item.id?'selected':''}>${esc(item.label)}</option>`).join('')}</select></div></div><label class="checkbox" style="margin-top:10px"><input type="checkbox" data-change="recall-expired" ${recall.includeExpired?'checked':''}>包含已过期内容</label><label class="checkbox"><input type="checkbox" data-change="recall-debug" ${recall.includeDebug?'checked':''}>包含仅调试生效的内容</label><button class="btn primary" style="width:100%;margin-top:13px" data-action="run-recall" ${state.recallRunning?'disabled':''}>${state.recallRunning?'<span class="spinner" style="width:15px;height:15px;margin:0;border-width:2px"></span>':icon('play')}${state.recallRunning?'执行中':'执行召回测试'}</button></section><section class="recall-results"><div class="section-title">召回结果${status?` <span style="margin-left:6px">${badge(status)}</span>`:''}${results.length?` <span class="badge blue" style="margin-left:6px">${results.length} 条</span>`:''}<div class="actions"><select class="select" data-change="result-sort"><option value="score" ${recall.sort==='score'?'selected':''}>按分数排序</option><option value="rank" ${recall.sort==='rank'?'selected':''}>按重排后排名</option></select><select class="select" data-change="result-kb"><option value="all" ${!recall.kbFilte   }
  function renderRecallResult(result){const doc=db.documents.find(item=>item.id===result.docId),kb=kbOf(result.kbId),source=sourceOf(result.sourceId),category=categoryOf(doc?.categoryId);return `<article class="result-card"><div class="result-head"><span class="score">${result.score.toFixed(3)}</span><span class="rank">重排前 #${result.before} → 重排后 #${result.rerank}</span><span class="push"></span>${badge(doc?.processingStatus||'-')}</div><p class="${result.expanded?'':'truncate'}" style="white-space:${result.expanded?'normal':'nowrap'}">${esc(result.content)}</p><div class="result-meta"><span class="badge blue">${esc(kb?.name||'-')}</span><span class="badge">${esc(doc?.name||'-')}</span><span class="badge">${esc(source?.name||'-')}</span><span class="badge">${esc(category?.name||'未分类')}</span><span class="badge">切片 ${result.chunkOrder}</span><span class="badge">${esc(doc?.scope||'-')}</span></div><div class="inline-actions" style="margin-top:9px"><button class="link" data-action="toggle-result" data-id="${result.id}">${result.expanded?'收起':'查看完整切片'}</button><button class="link" data-action="open-result-doc" data-id="${result.docId}">查看原文</button><span style="border-left:1px solid var(--line);margin:0 4px"></span><button class="link fb ${result.feedback==='relevant'?'fb-active positive':''}" data-action="result-feedback" data-id="${result.id}" data-value="relevant" title="标记该切片与问题相关">${result.feedback==='relevant'?'✓ 相关':'相关'}</button><button class="link fb ${result.feedback==='irrelevant'?'fb-active danger':''}" data-action="result-feedback" data-id="${result.id}" data-value="irrelevant" title="标记该切片与问题不相关">${result.feedback==='irrelevant'?'✓ 不相关':'不相关'}</button></div></article>`;}
  function renderRecallHistory(){const q=state.recallHistoryQuery||'',time=state.recallHistoryTime||'all';let rows=db.retrievalHistory.filter(item=>!q||item.question.toLowerCase().includes(q.toLowerCase()));if(time==='today')rows=rows.filter(item=>parseTime(item.createdAt)>=startOfToday().getTime());if(time==='week')rows=rows.filter(item=>parseTime(item.createdAt)>=startOfDaysAgo(7).getTime());return `<div class="toolbar compact"><div class="search-wrap">${icon('search')}<input class="input" data-bind="history-query" data-input="history-query" value="${esc(q)}" placeholder="搜索历史问题"></div><select class="select" data-change="history-time"><option value="all">全部时间</option><option value="today" ${time==='today'?'selected':''}>今天</option><option value="week" ${time==='week'?'selected':''}>近 7 天</option></select></div>${rows.length?`<div>${rows.map(item=>`<div class="history-row"><div><div class="inline-actions"><b>${esc(item.question)}</b>${badge(item.status||((item.results||[]).length?'成功':'无结果'))}</div><div class="cell-sub">${esc(item.config.mode)} · Top ${item.config.topK} · 阈值 ${item.config.threshold}</div></div><span>${(item.results||[]).length} 条</span><span>${esc(item.createdAt)}</span><div class="inline-actions"><button class="link" data-action="view-history" data-id="${item.id}">查看</button><button class="link" data-action="rerun-history" data-id="${item.id}">再次执行</button><button class="link danger" data-action="delete-history" data-id="${item.id}">删除</button></div></div>`).join('')}</div>`:renderState('flask','暂无测试历史','完成召回测试后，问题、配置和结果会保存在本地。','','')}`;}
  function renderRecallCompare(){const selected=state.compareConfigs.filter(item=>item.selected);return `<div class="info-box">${icon('info')}最多选择三组配置，对同一个问题比较召回数量、平均相似度与排名变化。</div><div class="compare-grid">${state.compareConfigs.map((cfg,index)=>`<article class="compare-card"><label class="checkbox"><input type="checkbox" data-change="compare-selected" data-id="${cfg.id}" ${cfg.selected?'checked':''}><b>${esc(cfg.name)}</b></label><div class="field"><label>检索方式</label><select class="select" data-compare-field="mode" data-id="${cfg.id}">${['混合检索','语义检索','关键词检索'].map(item=>`<option ${item===cfg.mode?'selected':''}>${item}</option>`).join('')}</select></div><div class="toggle-line"><span>结果重排序</span><button class="switch ${cfg.rerank?'on':''}" data-action="compare-toggle-rerank" data-id="${cfg.id}"></button></div><div class="field-grid"><div class="field"><label>Top K</label><input class="input" type="number" min="1" max="20" data-compare-field="topK" data-id="${cfg.id}" value="${cfg.topK}"></div><div class="field"><label>阈值</label><input class="input" type="number" min="0" max="1" step="0.01" data-compare-field="threshold" data-id="${cfg.id}" value="${cfg.threshold}"></div></div>${state.compareDone&&cfg.selected?`<div class="section" style="margin-top:12px"><div class="metric-chip">召回数量 <b>${Math.min(cfg.topK,3+index)}</b></div><div class="metric-chip">平均相似度 <b>${(0.82-index*.04).toFixed(3)}</b></div><div class="cell-sub">Top 结果：${index===2?'镍库存与现货升贴水':'铜产业链周报'} · 共有结果排名变化 ${index+1} 位 · 独有结果 ${index}</div></div>`:''}</article>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="run-compare" ${selected.length<2?'disabled':''}>${icon('play')}运行 ${selected.length} 组对比</button><span class="muted">使用当前测试问题：${esc(state.recall.question||'尚未输入')}</span></div>`;}

  function renderWizard(){const wizard=state.wizard;if(!wizard)return '';const titles=['选择文件数据源','浏览并选择文档','文档属性与同步规则','解析与切分规则','确认同步导入'];const descriptions=['只选择系统中已连接成功的数据源','明确勾选具体文档，支持跨目录保留','配置统一属性、更新与删除策略','配置解析能力、切片长度并预览','核对范围、容量与风险后创建任务'];let body='';

  function renderWizardSources(wizard){const q=(wizard.sourceQuery||'').toLowerCase(),type=wizard.sourceType||'all';const rows=db.connectedSources.filter(source=>(!q||(source.name+' '+source.description).toLowerCase().includes(q))&&(type==='all'||source.type===type));const selected=sourceOf(wizard.sourceId);return `<div class="info-box">${icon('info')}<div>这里只选择已连接的数据源。连接创建、测试与授权请前往现有“文件数据源”模块。</div></div><div class="toolbar compact" style="padding-left:0;padding-right:0"><div class="search-wrap">${icon('search')}<input class="input" data-bind="wizard-source-query" data-wizard-field="sourceQuery" value="${esc(wizard.sourceQuery||'')}" placeholder="搜索数据源"></div><select class="select" data-wizard-field="sourceType"><option value="all">全部类型</option>${[...new Set(db.connectedSources.map(source=>source.type))].map(value=>`<option ${wizard.sourceType===value?'selected':''}>${esc(value)}</option>`).join('')}</select><span class="push"></span><button class="btn" data-action="goto-data-sources">${icon('link')}前往文件数据源模块</button></div><div class="source-select-layout"><div>${rows.length?`<div class="source-card-grid">${rows.map(source=>`<article class="source-card selectable ${wizard.sourceId===source.id?'selected':''}" data-action="select-wizard-source" data-id="${source.id}"><div class="source-logo">${esc(source.name.slice(0,1))}</div><div class="source-copy"><b>${esc(source.name)}</b><small>${esc(source.type)} · ${esc(source.description)}</small><small>可访问目录 ${esc(source.root)} · 已导入 ${source.importedCount} 个</small></div><div class="source-meta">${badge(source.status)}<div style="margin-top:5px">权限 ${source.permission?'可访问':'不足'}</div></div></article>`).join('')}</div>`:renderState('database','没有可用数据源','未找到符合筛选条件的已连接文件数据源。','前往文件数据源模块','goto-data-sources')}</div><aside class="source-detail-card">${selected?`<h4>${esc(selected.name)}</h4><div class="description-list" style="grid-template-columns:1fr"><div class="description-item"><span>数据源类型 / 连接状态</span><b>${esc(selected.type)} · ${esc(selected.status)}</b></div><div class="description-item"><span>来源说明</span><b>${esc(selected.description)}</b></div><div class="description-item"><span>可访问目录</span><b>${esc(selected.root)}</b></div><div class="description-item"><span>最近更新 / 最近同步</span><b>${esc(selected.updatedAt)} / ${esc(selected.lastSyncAt)}</b></div><div class="description-item"><span>访问权限</span><b>${selected.permission?'有访问权限':'权限不足'}</b></div></div><div class="recent-list"><b>最近导入记录</b><div>${selected.importedCount?`${esc(selected.lastSyncAt)} · 已导入 ${selected.importedCount} 个文件`:'暂无导入记录'}</div></div>`:`<div class="state-box" style="min-height:230px;padding:10px"><div class="state-icon">${icon('database')}</div><h3>选择一个数据源</h3><p>查看基本信息和最近导入记录。</p></div>`}</aside></div>${wizard.errors?.source?`<div class="field-error">${esc(wizard.errors.source)}</div>`:''}`;}
  function selectedWizardFiles(wizard){return wizard.selectedFiles.map(id=>db.sourceFiles.find(file=>file.id===id)).filter(Boolean);}
  function sourceFolders(sourceId){const rows=db.sourceDirectories.filter(folder=>folder.sourceId===sourceId),result=[];function add(parentId,level){rows.filter(folder=>folder.parentId===parentId).forEach(folder=>{result.push({...folder,level});add(folder.id,level+1);});}add(null,0);return result;}
  function currentWizardFiles(wizard){let rows=db.sourceFiles.filter(file=>file.sourceId===wizard.sourceId&&file.folderId===wizard.folderId),q=(wizard.fileQuery||'').toLowerCase();if(q)rows=rows.filter(file=>file.name.toLowerCase().includes(q));if(wizard.fileType&&wizard.fileType!=='all')rows=rows.filter(file=>file.type===wizard.fileType);if(wizard.fileUpdated&&wizard.fileUpdated!=='all'){const days=Number(wizard.fileUpdated),limit=startOfDaysAgo(days).getTime();rows=rows.filter(file=>new Date(file.updatedAt.replace(' ','T')).getTime()>=limit);}return rows;}
  function fileDisabledReason(file){return {'无访问权限':'当前账号无权读取该文件','格式不支持':'当前解析服务不支持该文件格式','超出容量':'文件大小超过知识库可用容量','已从源端删除':'文件已从源数据源中删除','正在处理中':'该文件已有导入任务正在处理'}[file.status]||'';}

d);save();toast('测试历史已删除');render();return;}if(action==='compare-toggle-rerank'){const cfg=state.compareConfigs.find(item=>item.id===id);cfg.rerank=!cfg.rerank;render();return;}if(action==='run-compare'){const selected=state.compareConfigs.filter(item=>item.selected);if(selected.length<2){toast('请至少选择 2 组配置','error');return;}if(!state.recall.question.trim()){toast('请先输入用于对比的问题','error');return;}state.compareDone=true;toast(`已完成 ${selected.length} 组配置对比`);render();return;}
    if(action==='select-wizard-source'){if(state.wizard.manageAssocId)return;const source=sourceOf(id);state.wizard.sourceId=id;state.wizard.folderId=sourceFolders(id)[0]?.id||'';state.wizard.errors={};const existingAssoc=db.sourceBindings.find(item=>item.kbId===state.wizard.kbId&&item.sourceId===id);if(existingAssoc&&!state.wizard.manageAssocId){state.wizard.existingAssocId=existingAssoc.id;state.wizard.props.syncMode=existingAssoc.syncMode;state.wizard.props.schedule=existingAssoc.schedule||'每天 18:00';state.wizard.props.deletePolicy=existingAssoc.deletePolicy;state.wizard.props.autoSync=existingAssoc.autoSync;}else if(!state.wizard.manageAssocId){const selectedKb=kbOf(state.wizard.kbId);state.wizard.existingAssocId=null;state.wizard.props.syncMode='源文件更新后自动同步';state.wizard.props.schedule='每天 18:00';state.wizard.props.deletePolicy=selectedKb?.settings.defaultSourceDelete||'保留知识库中的文档';state.wizard.props.autoSync=true;}render();return;}if(action==='wizard-folder'){state.wizard.folderId=id;render();return;}if(action==='remove-wizard-file'){state.wizard.selectedFiles=state.wizard.selectedFiles.filter(fileId=>fileId!==id);render();return;}if(action==='wizard-toggle-prop'){const field=node.dataset.field;state.wizard.props[field]=!state.wizard.props[field];render();return;}if(action==='wizard-chunk-mode'){state.wizard.chunk.mode=node.dataset.value;render();return;}if(action==='wizard-toggle-chunk'){const field=node.dataset.field;state.wizard.chunk[field]=!state.wizard.chunk[field];render();return;}if(action==='wizard-prev'){if(state.wizard.manageAssocId&&state.wizard.step<=2)return;state.wizard.step--;state.wizard.errors={};render();return;}if(action==='wizard-next'){advanceWizard();return;}if(action==='wizard-confirm'){if(state.submitting)return;state.submitting=true;createImportFromWizard();state.submitting=false;return;}
    if(action==='wizard-close-confirm'){const afterConfirm=state.modal?.afterConfirm;state.wizard=null;state.modal=null;if(afterConfirm==='goto-data-sources'){navigateDataSources();return;}render();return;}
    if(action==='clear-selection'){state.selectedDocs=[];render();return;}
    if(action==='back-to-recall'){state.drawer={type:'recall'};render();return;}
    if(action==='result-feedback'){const result=state.recall.results.find(item=>item.id===id);if(!result)return;const value=node.dataset.value==='irrelevant'?'irrelevant':'relevant';result.feedback=value;db.retrievalHistory.forEach(item=>{(item.results||[]).forEach(stored=>{if(stored.id===id)stored.feedback=value;});});save();toast('已记录召回评价');render();return;}
  });

  function advanceWizard(){const wizard=state.wizard;wizard.errors={};if(wizard.step===1){const source=sourceOf(wizard.sourceId);if(!source)wizard.errors.source='请选择一个已连接的文件数据源';else if(source.status!=='连接成功')wizard.errors.source='该数据源当前不可访问，请前往文件数据源模块修复连接';else if(!source.permission)wizard.errors.source='当前账号没有该数据源的访问权限';if(wizard.errors.source){render();return;}}
    if(wizard.step===2&&!wizard.selectedFiles.length){wizard.errors.files='请至少明确选择一个可访问、受支持且容量允许的文件';render();return;}
    if(wizard.step===3&&wizard.props.showReference&&wizard.props.referenceMode==='自定义参考链接'&&!/^https?:\/\//i.test(wizard.props.customReference)){wizard.errors.props='自定义参考链接必须以 http:// 或 https:// 开头';render();return;}
    if(wizard.step===4&&wizard.chunk.mode==='通用切分'){const length=Number(wizard.chunk.length),overlap=Number(wizard.chunk.overlap);if(length<200||length>4000)wizard.errors.chunk='切片长度必须在 200–4000 之间';else if(overlap<0||overlap>1000||overlap>length*.3)wizard.errors.chunk='重叠长度需在 0–1000 之间，且不超过切片长度的 30%';if(wizard.errors.chunk){render();return;}}
    if(wizard.step===4&&wizard.chunk.mode==='父子分段'){const child=Number(wizard.chunk.childLength),parent=Number(wizard.chunk.parentLength),overlap=Number(wizard.chunk.overlap);if(child<200||child>1000)wizard.errors.chunk='子分段长度必须在 200–1000 之间';else if(parent<1024||parent>4000)wizard.errors.chunk='父分段长度必须在 1024–4000 之间';else if(child>=parent)wizard.errors.chunk='子分段长度必须小于父分段长度';else if(overlap<0||overlap>1000||overlap>child*.3)wizard.errors.chunk='重叠长度需在 0–1000 之间，且不超过子分段长度的 30%';if(wizard.errors.chunk){render();return;}}
    wizard.step=Math.min(5,wizard.step+1);render();
  }
  function recallTerms(question){const stop=new Set(['什么','哪些','如何','怎么','是否','可以','需要','相关','影响','有什','什么','么影','么是','请问','介绍','说明']);const terms=new Set();const text=question.toLowerCase();(text.match(/[a-z0-9]{2,}/g)||[]).forEach(term=>terms.add(term));(text.match(/[\u4e00-\u9fff]{2,}/g)||[]).forEach(sequence=>{for(let size=2;size<=Math.min(4,sequence.length);size++){for(let index=0;index<=sequence.length-size;index++){const term=sequence.slice(index,index+size);if(!stop.has(term))terms.add(term);}}});return [...terms];}
  function rankRecallCandidates(recall,question,availableKbIds){const terms=recallTerms(question);return db.documents.filter(doc=>availableKbIds.includes(doc.kbId)&&isDocumentRetrievable(doc,recall)&&(recall.sourceId==='all'||doc.sourceId===recall.sourceId)&&(recall.categoryId==='all'||doc.categoryId===recall.categoryId)).flatMap(doc=>(doc.chunks||[]).filter(chunk=>chunk.indexStatus==='索引已建立').map(chunk=>{const kb=kbOf(doc.kbId),source=sourceOf(doc.sourceId),category=categoryOf(doc.categoryId);const corpus=[doc.name,doc.preview,doc.tags.join(' '),chunk.content,chunk.keywords.join(' '),kb?.name,source?.name,category?.name].join(' ').toLowerCase();const matched=terms.filter(term=>corpus.includes(term));const directTags=doc.tags.filter(tag=>question.includes(tag)).length;const score=Math.min(.97,.63+matched.length*.035+directTags*.08);return {doc,chunk,score,matched:matched.length+directTags};})).filter(item=>item.matched>0&&item.score>=recall.threshold).sort((a,b)=>b.score-a.score).slice(0,recall.topK);}
  function runRecall(){const recall=state.recall,question=recall.question.trim();recall.validationError='';if(!recall.kbIds.length)recall.validationError='请至少选择一个知识库';else if(!question)recall.validationError='请输入测试问题';else if(question.length>4000)recall.validationError='测试问题不可超过 4000 字';else if(Number(recall.topK)<1||Number(recall.topK)>20)recall.validationError='文档召回数量必须在 1–20 之间';else if(Number(recall.threshold)<0||Number(recall.threshold)>1)recall.validationError='匹配度阈值必须在 0–1 之间';if(recall.validationError){recall.executionStatus='配置校验失败';recall.failedKbIds=[];recall.results=[];recall.hasRun=false;render();return;}const failedKbIds=recall.kbIds.filter(id=>kbOf(id)?.recallAvailable===false),availableKbIds=recall.kbIds.filter(id=>!failedKbIds.includes(id));state.recallRunning=true;recall.executionStatus='执行中';recall.failedKbIds=[];recall.hasRun=false;recall.results=[];render();setTimeout(()=>{recall.failedKbIds=failedKbIds;const ranked=rankRecallCandidates(recall,question,availableKbIds);recall.results=ranked.map((item,index)=>({id:uid('result'),docId:item.doc.id,kbId:item.doc.kbId,sourceId:item.doc.sourceId,chunkOrder:item.chunk.order,content:item.chunk.content,score:item.score,before:index+1,rerank:recall.rerank?Math.max(1,index+(index%2?0:1)):index+1,expanded:false}));state.recallRunning=false;recall.hasRun=true;recall.executionStatus=!availableKbIds.length?'全部执行失败':failedKbIds.length?'部分知识库失败':recall.results.length?'成功':'无结果';const history={id:uid('history'),question,kbIds:[...recall.kbIds],status:recall.executionStatus,failedKbIds:[...failedKbIds],config:{mode:recall.mode,tableEnhance:recall.tableEnhance,rerank:recall.rerank,rerankModel:recall.rerankModel,topK:recall.topK,threshold:recall.threshold,sourceId:recall.sourceId,categoryId:recall.categoryId,includeExpired:recall.includeExpired,includeDebug:recall.includeDebug},results:JSON.parse(JSON.stringify(recall.results)),createdAt:nowText()};db.retrievalHistory.unshift(history);save();render();if(recall.executionStatus==='全部执行失败')toast('所选知识库当前均不可用','error');else if(recall.executionStatus==='部分知识库失败')toast(`召回已完成，${failedKbIds.length} 个知识库不可用`,'error');else toast(recall.results.length?`召回测试完成，共命中 ${recall.results.length} 个切片`:'召回测试完成，没有命中结果');},850);}

  // ==============================
  // 15. Routing and view switching
  // ==============================
  window.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(state.menu){state.menu=null;render();return;}if(state.modal){state.modal=null;render();return;}if(state.drawer){state.drawer=null;render();return;}if(state.wizard){const wizard=state.wizard;if(wizard.step>1||wizard.selectedFiles.length){state.modal={type:'wizard-close'};}else{state.wizard=null;}render();return;}});
  window.addEventListener('hashchange',()=>{state.menu=null;state.modal=null;state.drawer=null;state.wizard=null;render();});
  // ==============================
  // 16. Initialization
  // ==============================
  // 初始化统一重派生知识库状态，避免 localStorage 旧状态与真实数据不一致
  db.knowledgeBases.forEach(kb=>deriveKnowledgeBaseStatus(kb.id));
  save();
  db.importTasks.filter(task=>task.autoAdvance===true&&task.progress<100&&!['已取消','已暂停','处理失败','权限不足','来源不可访问','超出容量'].includes(task.stage)).forEach(task=>simulateTask(task.id));
  notifyShell();
  render();
})();

  </script>
