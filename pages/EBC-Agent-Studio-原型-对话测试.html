<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EBC Agent Studio - 召回测试</title>
  <style>
    :root{--blue:#2d63f1;--line:#e4eaf5;--text:#1d273a;--muted:#74809a;--bg:#f4f7fc;--danger:#d94a4a;--radius:10px;--shadow:rgba(28,42,64,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--text);background:var(--bg)}
    button,input,textarea{font:inherit}
    .page{height:100%;display:flex;flex-direction:column;overflow:hidden}
    .topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;flex:0 0 auto}
    .title-wrap{display:inline-flex;align-items:center;gap:8px;flex:1;min-width:0}
    .back-btn{width:30px;height:30px;border:1px solid #d9e0ee;border-radius:8px;background:#f6f9ff;color:#57617a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    h1{margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1b2940}
    .tip{width:15px;height:15px;border:1px solid #a5afc3;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#6f7b94;cursor:help;line-height:1}
    .tabs{display:inline-flex;height:32px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .tab{border:0;padding:0 12px;background:#f7faff;min-width:94px;color:#697486;font-size:12px;cursor:pointer}
    .tab:last-child{border-left:1px solid var(--line)}
    .tab.active{background:#fff;color:var(--blue);font-weight:700}
    .workspace{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
    .left{width:410px;max-width:480px;min-width:270px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
    .left.collapsed{width:62px}
    .left.collapsed .left-title,.left.collapsed .left-body{display:none}
    .left-head{height:52px;padding:0 10px;display:flex;align-items:center;background:#fbfdff;border-bottom:1px solid var(--line)}
    .left-title{display:inline-flex;align-items:center;gap:8px;min-width:0;flex:1}
    .left-title h2{margin:0;font-size:14px;color:#26344c;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .left-title p{display:none}
    .left-head-ops{margin-left:auto;display:inline-flex;gap:7px}
    .icon-btn{width:30px;height:30px;border:1px solid #dce3f0;background:#f4f7ff;color:#5d6a82;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .left-body{padding:9px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto}
    .card{border:1px solid var(--line);border-radius:8px;background:#fcfdff;display:flex;flex-direction:column;min-width:0}
    .card-head{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 9px;background:#f7faff}
    .card-title{font-size:12px;color:#41506c;font-weight:700;margin:0}
    .card-body{padding:9px;display:flex;flex-direction:column;gap:8px}
    .card-foot{padding:9px;border-top:1px solid var(--line);background:#fbfdff}
    .btn{height:30px;border:1px solid #d8e0f0;background:#fff;color:#3d4b65;border-radius:7px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
    .btn:hover{background:#f5f8ff;border-color:#aebee6;color:var(--blue)}
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn.primary:hover{background:#2551d1}
    .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
    .btn[disabled]{opacity:.55;pointer-events:none}
    .btn.icon{width:30px;padding:0}
    .kb-list{display:flex;flex-direction:column;gap:7px;max-height:175px;overflow:auto}
    .kb-card{border:1px solid #dde4f2;border-radius:8px;padding:7px;background:#fff;display:flex;align-items:flex-start;gap:8px}
    .kb-name{font-size:12px;font-weight:600;color:#29344b;word-break:break-all;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .kb-meta{font-size:11px;color:#7d8798;line-height:1.35;word-break:break-all}
    .kb-content{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
    .kb-actions{margin-left:auto}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:12px;color:#44536a;display:inline-flex;align-items:center;gap:6px}
    .field .required{color:var(--danger)}
    .help{color:#7b869a;font-size:11px;line-height:1.5}
    .input,.input-area{width:100%;border:1px solid #dce4ef;border-radius:7px;height:34px;padding:0 10px;color:#273246;background:#fff}
    .input-area{min-height:72px;height:auto;resize:vertical;padding-top:7px;line-height:1.35}
    .range-wrap{display:flex;align-items:center;gap:6px}
    .range{width:100%;accent-color:var(--blue)}
    .num-wrap{display:inline-flex;align-items:center;height:28px;border:1px solid #dbe3f1;border-radius:7px;overflow:hidden;flex:0 0 110px}
    .num-wrap button{width:26px;height:100%;border:0;background:#f4f7fe;cursor:pointer}
    .num-wrap button+button{border-left:1px solid #dbe3f1}
    .num-wrap input{width:50px;height:100%;border:0;text-align:center;color:#263148}
    .toggle-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .toggle{width:36px;height:18px;border:0;background:#d7e0f0;border-radius:999px;position:relative;cursor:pointer}
    .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.2);transition:.15s}
    .toggle.on{background:#2d63f1}.toggle.on::after{left:20px}
    .toggle-text{font-size:11px;color:#52607a;min-width:28px}
    .right{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px var(--shadow);display:flex;flex-direction:column;overflow:hidden}
    .result-head{height:56px;border-bottom:1px solid var(--line);background:#fbfdff;display:flex;align-items:center;padding:0 11px;gap:9px}
    .result-title{font-size:14px;color:#28344f;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .right-toolbar{margin-left:auto;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
    .content{flex:1;min-height:0;padding:10px;overflow:auto}
    .recall-empty{min-height:130px;display:flex;align-items:center;justify-content:center;color:#76829a;font-size:13px;text-align:center}
    .loading{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(255,255,255,.72);display:none;align-items:center;justify-content:center;gap:8px;color:#62708a}
    .spin{width:14px;height:14px;border:2px solid #b8c2d6;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
    .compare-wrap{margin-bottom:8px}.compare-wrap .tag{font-size:11px;color:#647288;margin-bottom:6px;display:block}
    .compare-strip{display:flex;flex-wrap:wrap;gap:6px}
    .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #d7e0f1;border-radius:999px;padding:5px 8px;font-size:11px;background:#fff;color:#46556f}
    .result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
    .result-card{border:1px solid #dce5f3;border-radius:9px;overflow:hidden}
    .result-card-head{height:36px;background:#fff;border-bottom:1px solid #e4eaf6;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;color:#37445c}
    .result-card-body{padding:8px;display:flex;flex-direction:column;gap:8px}
    .recall-item{border:1px solid #dce6f7;background:#fff;padding:7px;border-radius:8px}
    .recall-title{font-size:12px;color:#26354d;font-weight:600;display:flex;justify-content:space-between;gap:8px}
    .recall-score{color:#2b62e8;font-size:11px;font-weight:700}
    .recall-text{font-size:11px;color:#57627a;line-height:1.45;margin-top:5px;word-break:break-word}
    .small-btn{border:0;background:transparent;color:#2a63eb;padding:0;font-size:11px}
    .table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff}
    table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
    thead th{position:sticky;top:0;background:#fafcff;color:#637086;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:8px;border-bottom:1px solid #edf1f8;color:#30415a;word-break:break-word;vertical-align:top}
    tr:hover td{background:#fafcff}
    .pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:9px 10px;border-top:1px solid var(--line);font-size:11px;color:#6e7a90;flex-wrap:wrap}
    .pager select,.pager input{height:28px;border:1px solid #dbe3f2;border-radius:7px;padding:0 6px}
    .history-empty{padding:30px;text-align:center;color:#8390a4}
    .hidden{display:none!important}
    .view{display:none;height:100%;min-height:0;overflow:hidden;position:relative}
    .view.show{display:flex;flex-direction:column}
    .search-select{position:relative}
    .search-select-input{width:100%;height:34px;padding:0 26px 0 10px;border:1px solid #dce3ef;border-radius:7px;background:#fff}
    .search-select-trigger{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#8b94a6}
    .search-select-panel{position:absolute;left:0;right:0;top:calc(100%+6px);border:1px solid #d9e2f1;background:#fff;border-radius:8px;box-shadow:0 10px 24px rgba(21,33,55,.14);z-index:20;display:none}
    .search-select-panel.show{display:block}
    .select-search{padding:7px;border-bottom:1px solid #edf1f8}
    .select-search input{width:100%;height:30px;border:1px solid #dce3ef;border-radius:7px;padding:0 8px}
    .select-list{max-height:170px;overflow:auto;padding:6px}
    .select-option{width:100%;text-align:left;padding:8px;border:0;border-radius:7px;background:transparent;color:#2b354a;cursor:pointer}
    .select-option:hover{background:#f2f6ff;color:var(--blue)}
    .select-empty{font-size:11px;color:#8a93a7;text-align:center;padding:8px}
    .toast{position:fixed;right:16px;top:80px;z-index:120;background:#1e2d4b;color:#fff;border-radius:8px;padding:10px 12px;font-size:12px;opacity:0;transform:translateY(-8px);transition:.16s;pointer-events:none;max-width:380px;line-height:1.4}
    .toast.show{opacity:1;transform:translateY(0)}
    .modal-mask{position:fixed;inset:0;background:rgba(13,27,48,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
    .modal-mask.show{display:flex}
    .modal{width:min(840px,calc(100vw - 28px));max-height:calc(100vh - 28px);background:#fff;border-radius:11px;box-shadow:0 24px 60px rgba(18,29,50,.36);overflow:hidden;display:flex;flex-direction:column}
    .modal.small{width:min(500px,calc(100vw - 28px))}
    .modal-head{height:52px;padding:0 14px;border-bottom:1px solid var(--line);background:#fafcff;display:flex;align-items:center;gap:8px}
    .modal-head h3{margin:0;font-size:16px;color:#263247;flex:1}
    .modal-body{padding:10px;overflow:auto}
    .modal-body .row{display:grid;grid-template-columns:1fr;gap:10px}
    .modal-foot{padding:10px;border-top:1px solid var(--line);background:#f9fbff;display:flex;justify-content:flex-end;gap:8px}
    .picker-note{display:flex;align-items:center;justify-content:space-between;color:#708096;font-size:11px;margin-bottom:8px}
    .picker-list{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fcfdff}
    .picker-item{display:flex;align-items:flex-start;gap:8px;border:1px solid #dde5f2;border-radius:7px;padding:8px;background:#fff}
    .picker-main{min-width:0;display:flex;flex-direction:column;gap:2px}
    .picker-main .name{font-size:12px;color:#29354d;font-weight:600}
    .picker-main .meta{font-size:11px;color:#8a95a4}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:1100px){.workspace{flex-direction:column}.left{width:100%;max-width:100%}.left.collapsed{width:100%}}
  </style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="title-wrap">
      <button id="backBtn" class="back-btn" title="返回">←</button>
      <h1>召回测试</h1>
      <span class="tip" title="选择知识库，输入问题后测试召回结果。用于知识库内容优化和检索策略调优。">i</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="recall" type="button">召回测试</button>
      <button class="tab" data-tab="history" type="button">测试记录</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="left" id="leftPanel">
      <div class="left-head">
        <div class="left-title">
          <h2>
            召回测试设置
          </h2>
        </div>
        <div class="left-head-ops">
          <button class="icon-btn" id="globalRuleBtn" title="知识库检索设置" type="button">⚙</button>
          <button class="icon-btn" id="collapseLeft" title="收起" type="button">◀</button>
        </div>
      </div>
      <div class="left-body" id="leftBody">
        <section class="card">
          <div class="card-head"><h3 class="card-title">知识库（可选择最多3个）</h3></div>
          <div class="card-body">
            <div id="kbList" class="kb-list"></div>
          </div>
          <div class="card-foot">
            <button class="btn" id="openKbPicker" type="button">+ 选择知识库</button>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h3 class="card-title">问题输入</h3></div>
          <div class="card-body">
            <div class="field">
              <textarea class="input-area" id="questionInput" rows="5" placeholder="问题输入框" maxlength="4000"></textarea>
              <p class="help">问题非必填，留空时按默认问题进行测试。</p>
            </div>
            <button class="btn primary" id="runBtn" type="button">测试</button>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h3 class="card-title">最近测试问题 <span class="tip" title="记录最近7天测试问题">i</span></h3>
          </div>
          <div class="card-body">
            <input class="input" id="recentSearch" type="text" placeholder="问题搜索" />
            <div class="table-wrap" style="max-height:150px;">
              <table>
                <thead><tr><th style="width:100%">输入问题</th><th style="width:120px">查询时间</th></tr></thead>
                <tbody id="recentRows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <section class="right">
      <section id="recallView" class="view show">
        <div class="result-head">
          <h2 class="result-title">召回结果</h2>
          <div class="right-toolbar">
            <button class="btn" id="compareModeBtn" type="button">召回测试对比</button>
            <button class="btn" id="addCompareBtn" type="button" disabled>+ 添加对比</button>
            <button class="btn" id="exportBtn" type="button">导出</button>
            <button class="btn" id="clearBtn" type="button">清空</button>
          </div>
        </div>
        <div class="content">
          <div class="compare-wrap" id="compareWrap">
            <span class="tag">对比配置</span>
            <div class="compare-strip" id="compareStrip"></div>
          </div>
          <div class="result-grid" id="resultGrid"></div>
          <div class="recall-empty hidden" id="recallEmpty">点击“测试”开始生成召回结果</div>
          <div class="loading" id="recallLoading"><span class="spin"></span>召回中...</div>
        </div>
      </section>

      <section id="historyView" class="view">
        <div class="result-head">
          <h2 class="result-title">测试记录</h2>
          <div class="right-toolbar">
            <button class="btn" id="historyExport" type="button">导出</button>
            <button class="btn danger" id="historyClear" type="button">清空</button>
          </div>
        </div>
        <div class="content">
          <div class="table-wrap" style="height:100%;display:flex;flex-direction:column;min-height:0">
            <div style="padding:8px;background:#fafcff;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center">
              <input class="input" id="historySearch" style="max-width:320px" type="text" placeholder="搜索问题" />
            </div>
            <div style="flex:1;min-height:0;overflow:auto">
              <table>
                <thead>
                  <tr>
                    <th class="col-q">测试问题</th>
                    <th style="width:150px">查询时间</th>
                    <th style="width:150px">知识库</th>
                    <th style="width:100px">操作</th>
                  </tr>
                </thead>
                <tbody id="historyRows"></tbody>
              </table>
            </div>
            <div class="pager" id="historyPager"></div>
          </div>
          <div class="history-empty hidden" id="historyEmpty">暂无记录</div>
        </div>
      </section>
    </section>
  </main>
</div>

<div id="globalRuleModal" class="modal-mask" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head"><h3>检索召回设置</h3><button class="icon-btn" id="closeGlobalRule" type="button">×</button></div>
    <div class="modal-body">
      <p class="help">当多个知识库并行检索后，先对候选结果进行统一重排序。</p>
      <div class="row">
        <div class="field">
          <label><span>重排序模型</span><span class="required">*</span></label>
          <div class="search-select" id="globalRerankSelect">
            <input id="globalRerankInput" class="search-select-input" readonly />
            <span class="search-select-trigger">▾</span>
            <div class="search-select-panel"><div class="select-search"><input id="globalRerankSearch" type="text" placeholder="搜索模型"></div><div id="globalRerankList" class="select-list"></div></div>
          </div>
        </div>
        <div class="field">
          <label><span>召回数量</span><span class="required">*</span></label>
          <div class="range-wrap">
            <input id="globalTopKRange" class="range" type="range" min="1" max="50" step="1">
            <div class="num-wrap">
              <button type="button" data-step-control="globalTopK" data-dir="-">-</button>
              <input id="globalTopKNum" type="text" inputmode="numeric" />
              <button type="button" data-step-control="globalTopK" data-dir="+">+</button>
            </div>
          </div>
          <div class="help">1~50</div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelGlobalRule" type="button">取消</button><button class="btn primary" id="saveGlobalRule" type="button">确定</button></div>
  </div>
</div>

<div id="kbPickerModal" class="modal-mask" role="dialog" aria-modal="true">
  <div class="modal small">
    <div class="modal-head"><h3>选择知识库</h3><button class="icon-btn" id="closeKbPicker" type="button">×</button></div>
    <div class="modal-body">
      <div class="picker-note"><input class="input" id="kbPickerSearch" placeholder="搜索知识库" style="max-width:260px"><span id="kbPickerCount"></span></div>
      <div class="picker-list" id="kbPickerList"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelKbPicker" type="button">取消</button><button class="btn primary" id="saveKbPicker" type="button">确定</button></div>
  </div>
</div>

<div id="kbSettingModal" class="modal-mask" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head"><h3 id="kbSettingTitle">知识库检索设置</h3><button class="icon-btn" id="closeKbSetting" type="button">×</button></div>
    <div class="modal-body">
      <div class="row">
        <div class="field">
          <label>检索策略</label>
          <div class="toggle-line" style="margin-top:2px">
            <label><input type="radio" name="strategy" value="hybrid" checked />混合检索
              <span class="tip" title="同时执行关键词检索和向量检索，推荐在字符串和语义结合场景。">i</span>
            </label>
            <label><input type="radio" name="strategy" value="semantic" />语义检索
              <span class="tip" title="推荐 query 与文本切片重叠词汇少，需要语义匹配的场景。">i</span>
            </label>
          </div>
        </div>
        <div class="field">
          <label>NL2SQL模型<span class="required">*</span>
            <span class="tip" title="用于将自然语言查询转换为SQL语句的模型">i</span>
          </label>
          <div class="search-select" id="nl2sqlSelect">
            <input id="nl2sqlInput" class="search-select-input" readonly>
            <span class="search-select-trigger">▾</span>
            <div class="search-select-panel"><div class="select-search"><input id="nl2sqlSearch" placeholder="搜索模型"></div><div id="nl2sqlList" class="select-list"></div></div>
          </div>
        </div>
        <div class="toggle-line">
          <label class="toggle-line"><span>Excel检索增强</span><span class="tip" title="打开后，支持对Excel表格进行自然语言查询和计算，可能增加耗时。">i</span></label>
          <span>
            <button class="toggle" id="excelToggle" type="button"></button>
            <span class="toggle-text" id="excelToggleText">开启</span>
          </span>
        </div>
        <div class="toggle-line">
          <label class="toggle-line"><span>结果重排序</span><span class="tip" title="开启后可重新调整召回片段顺序，使更相关内容排前。">i</span></label>
          <span>
            <button class="toggle" id="rerankToggle" type="button"></button>
            <span class="toggle-text" id="rerankToggleText">开启</span>
          </span>
        </div>
        <div class="field">
          <label>重排序模型<span class="required">*</span>
            <span class="tip" title="用于进一步优化召回结果排序。">i</span>
          </label>
          <div class="search-select" id="rerankSelect">
            <input id="rerankInput" class="search-select-input" readonly>
            <span class="search-select-trigger">▾</span>
            <div class="search-select-panel"><div class="select-search"><input id="rerankSearch" placeholder="搜索模型"></div><div id="rerankList" class="select-list"></div></div>
          </div>
        </div>
        <div class="toggle-line">
          <label class="toggle-line"><span>文档</span></label>
          <span>
            <button class="toggle" id="docToggle" type="button"></button>
            <span class="toggle-text" id="docToggleText">开启</span>
          </span>
        </div>
        <div class="field">
          <label>文档召回数量
            <span class="tip" title="检索返回的最高匹配度的N个文档片段">i</span>
          </label>
          <div class="range-wrap">
            <input id="docTopKRange" class="range" type="range" min="1" max="20" step="1">
            <div class="num-wrap">
              <button type="button" data-step-control="docTopK" data-dir="-">-</button>
              <input id="docTopKNum" type="text" inputmode="numeric" />
              <button type="button" data-step-control="docTopK" data-dir="+">+</button>
            </div>
          </div>
          <div class="help">1~20</div>
        </div>
        <div class="field">
          <label>文档检索匹配度
            <span class="tip" title="值越低召回更多切片，但准确性可能下降。">i</span>
          </label>
          <div class="range-wrap">
            <input id="docMatchRange" class="range" type="range" min="0" max="0.99" step="0.01">
            <div class="num-wrap">
              <button type="button" data-step-control="docMatch" data-dir="-">-</button>
              <input id="docMatchNum" type="text" inputmode="decimal" />
              <button type="button" data-step-control="docMatch" data-dir="+">+</button>
            </div>
          </div>
          <div class="help">0~0.99</div>
        </div>
      </div>
      <p class="help" id="kbSettingErr" style="margin:0;min-height:14px"></p>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelKbSetting" type="button">取消</button><button class="btn primary" id="saveKbSetting" type="button">确定</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    var KB_POOL = [
      { id: "kb_sales", name: "销售知识库", desc: "销售话术、合同条款、竞品信息" },
      { id: "kb_product", name: "产品知识库", desc: "产品说明、功能清单、更新日志" },
      { id: "kb_hr", name: "HR 知识库", desc: "人事制度、流程规范、常见问题解答" },
      { id: "kb_tech", name: "技术知识库", desc: "开发规范、故障手册、架构说明" },
      { id: "kb_marketing", name: "运营知识库", desc: "活动模板、投放策略、案例总结" }
    ];

    var MODEL_OPTIONS = [
      "Qwen2.5-3B-Instruct",
      "Qwen2.5-7B-Instruct",
      "Text2SQL-XL",
      "SQLPilot-V3",
      "MiniSQL-2.1"
    ];

    var RERANK_OPTIONS = [
      "BGE-Rerank-small",
      "BGE-Rerank-large",
      "CrossEncoder-1",
      "CrossEncoder-2",
      "MonoRerank"
    ];

    var $ = function (id) { return document.getElementById(id); };
    var toast = $("toast");
    var leftPanel = $("leftPanel");
    var collapseLeft = $("collapseLeft");
    var openKbPicker = $("openKbPicker");
    var kbList = $("kbList");
    var questionInput = $("questionInput");
    var runBtn = $("runBtn");
    var recentSearch = $("recentSearch");
    var recentRows = $("recentRows");
    var compareModeBtn = $("compareModeBtn");
    var addCompareBtn = $("addCompareBtn");
    var compareWrap = $("compareWrap");
    var compareStrip = $("compareStrip");
    var recallView = $("recallView");
    var historyView = $("historyView");
    var resultGrid = $("resultGrid");
    var recallEmpty = $("recallEmpty");
    var recallLoading = $("recallLoading");
    var tabRecall = document.querySelector('.tab[data-tab="recall"]');
    var tabHistory = document.querySelector('.tab[data-tab="history"]');
    var exportBtn = $("exportBtn");
    var clearBtn = $("clearBtn");
    var historyExport = $("historyExport");
    var historyClear = $("historyClear");
    var historySearch = $("historySearch");
    var historyRows = $("historyRows");
    var historyPager = $("historyPager");
    var historyEmpty = $("historyEmpty");
    var backBtn = $("backBtn");
    var globalRuleBtn = $("globalRuleBtn");
    var globalRuleModal = $("globalRuleModal");
    var closeGlobalRule = $("closeGlobalRule");
    var cancelGlobalRule = $("cancelGlobalRule");
    var saveGlobalRule = $("saveGlobalRule");
    var globalRerankInput = $("globalRerankInput");
    var globalRerankSearch = $("globalRerankSearch");
    var globalRerankList = $("globalRerankList");
    var globalTopKRange = $("globalTopKRange");
    var globalTopKNum = $("globalTopKNum");
    var kbPickerModal = $("kbPickerModal");
    var kbPickerSearch = $("kbPickerSearch");
    var kbPickerList = $("kbPickerList");
    var kbPickerCount = $("kbPickerCount");
    var closeKbPicker = $("closeKbPicker");
    var cancelKbPicker = $("cancelKbPicker");
    var saveKbPicker = $("saveKbPicker");
    var kbSettingModal = $("kbSettingModal");
    var kbSettingTitle = $("kbSettingTitle");
    var kbSettingErr = $("kbSettingErr");
    var closeKbSetting = $("closeKbSetting");
    var cancelKbSetting = $("cancelKbSetting");
    var saveKbSetting = $("saveKbSetting");
    var nl2sqlInput = $("nl2sqlInput");
    var nl2sqlSearch = $("nl2sqlSearch");
    var nl2sqlList = $("nl2sqlList");
    var rerankInput = $("rerankInput");
    var rerankSearch = $("rerankSearch");
    var rerankList = $("rerankList");
    var excelToggle = $("excelToggle");
    var excelToggleText = $("excelToggleText");
    var rerankToggle = $("rerankToggle");
    var rerankToggleText = $("rerankToggleText");
    var docToggle = $("docToggle");
    var docToggleText = $("docToggleText");
    var docTopKRange = $("docTopKRange");
    var docTopKNum = $("docTopKNum");
    var docMatchRange = $("docMatchRange");
    var docMatchNum = $("docMatchNum");

    var state = {
      selectedKbIds: ["kb_sales", "kb_product", "kb_hr"],
      recentQuestions: [],
      history: [],
      historyState: { page: 1, pageSize: 10, keyword: "" },
      leftCollapsed: false,
      compareMode: false,
      compareGroups: [],
      settingTarget: { type: "", id: "" },
      globalSetting: { rerankModel: RERANK_OPTIONS[0], topK: 12 },
      kbConfigs: {},
      baseSetting: null
    };

    state.baseSetting = makeDefaultSetting();

    KB_POOL.forEach(function (kb) {
      state.kbConfigs[kb.id] = mergeSetting(state.baseSetting);
    });

    var activeSelectPanel = null;

    function toNameTime(ts) {
      var d = new Date(ts);
      var y = d.getFullYear();
      var m = ("0" + (d.getMonth() + 1)).slice(-2);
      var day = ("0" + d.getDate()).slice(-2);
      var h = ("0" + d.getHours()).slice(-2);
      var i = ("0" + d.getMinutes()).slice(-2);
      return y + "-" + m + "-" + day + " " + h + ":" + i;
    }

    function clamp(v, min, max) {
      if (isNaN(v)) return min;
      var n = Number(v);
      if (n < min) return min;
      if (n > max) return max;
      return n;
    }

    function makeDefaultSetting() {
      return {
        strategy: "hybrid",
        nl2sql: MODEL_OPTIONS[0],
        excel: true,
        rerank: true,
        rerankModel: RERANK_OPTIONS[0],
        docEnabled: true,
        docTopK: 8,
        docMatch: 0.7
      };
    }

    function mergeSetting(s) {
      return {
        strategy: s.strategy,
        nl2sql: s.nl2sql,
        excel: !!s.excel,
        rerank: !!s.rerank,
        rerankModel: s.rerankModel,
        docEnabled: !!s.docEnabled,
        docTopK: Number(s.docTopK),
        docMatch: Number(s.docMatch)
      };
    }

    function normalizeSetting(s) {
      return {
        strategy: s.strategy || "hybrid",
        nl2sql: (s.nl2sql || "").trim(),
        excel: !!s.excel,
        rerank: !!s.rerank,
        rerankModel: (s.rerankModel || "").trim(),
        docEnabled: !!s.docEnabled,
        docTopK: clamp(Math.round(s.docTopK || 8), 1, 20),
        docMatch: Number(clamp(Number(s.docMatch || 0.7), 0, 0.99).toFixed(2))
      };
    }

    function uid(prefix) {
      return prefix + "-" + Date.now() + "-" + Math.floor(Math.random() * 99999);
    }

    function safeText(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showToast(msg, timeout) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window.__recallToastTimer);
      window.__recallToastTimer = setTimeout(function () {
        toast.classList.remove("show");
      }, timeout || 1800);
    }

    function openModal(el) {
      el.classList.add("show");
    }

    function closeModal(el) {
      el.classList.remove("show");
      activeSelectPanel = null;
    }

    function closeAllModals() {
      closeModal(globalRuleModal);
      closeModal(kbPickerModal);
      closeModal(kbSettingModal);
    }

    function setToggle(btn, label, on) {
      btn.classList.toggle("on", !!on);
      label.textContent = on ? "开启" : "关闭";
      btn.dataset.state = on ? "on" : "off";
    }

    function initToggle(btn, label, initial, callback) {
      setToggle(btn, label, initial);
      btn.addEventListener("click", function () {
        var next = btn.dataset.state !== "on";
        setToggle(btn, label, next);
        callback(next);
      });
    }

    function syncLeftPanel() {
      if (state.leftCollapsed) {
        leftPanel.classList.add("collapsed");
        collapseLeft.textContent = "▶";
        collapseLeft.title = "展开";
        globalRuleBtn.classList.add("hidden");
      } else {
        leftPanel.classList.remove("collapsed");
        collapseLeft.textContent = "◀";
        collapseLeft.title = "收起";
        globalRuleBtn.classList.remove("hidden");
      }
    }

    function getKbById(id) {
      for (var i = 0; i < KB_POOL.length; i++) {
        if (KB_POOL[i].id === id) return KB_POOL[i];
      }
      return null;
    }

    function renderKbList() {
      kbList.innerHTML = "";

      if (state.selectedKbIds.length === 0) {
        var empty = document.createElement("div");
        empty.style.color = "#909cb4";
        empty.style.fontSize = "12px";
        empty.textContent = "知识库";
        kbList.appendChild(empty);
        return;
      }

      state.selectedKbIds.forEach(function (id) {
        var kb = getKbById(id);
        if (!kb) return;
        var card = document.createElement("div");
        card.className = "kb-card";
        var content = document.createElement("div");
        content.className = "kb-content";
        var name = document.createElement("div");
        name.className = "kb-name";
        name.textContent = kb.name;
        content.appendChild(name);
        card.appendChild(content);
        var actions = document.createElement("div");
        actions.className = "kb-actions";
        var setting = document.createElement("button");
        setting.type = "button";
        setting.className = "btn icon-btn";
        setting.textContent = "设置";
        setting.disabled = !!state.compareMode;
        if (state.compareMode) setting.title = "对比模式下请在“对比配置”里设置";
        setting.dataset.kb = id;
        setting.addEventListener("click", function () {
          openKbSettingByKb(id);
        });
        actions.appendChild(setting);
        card.appendChild(actions);
        kbList.appendChild(card);
      });
    }

    function renderRecentRows() {
      var keyword = (recentSearch.value || "").trim().toLowerCase();
      var rows = state.recentQuestions.filter(function (item) {
        if (!keyword) return true;
        return item.question.toLowerCase().indexOf(keyword) >= 0;
      }).slice(0, 30);
      recentRows.innerHTML = "";

      if (rows.length === 0) {
        var tr = document.createElement("tr");
        var td = document.createElement("td");
        td.colSpan = 2;
        td.style.color = "#8997ae";
        td.style.textAlign = "center";
        td.style.padding = "14px 8px";
        td.textContent = "暂无最近问题";
        tr.appendChild(td);
        recentRows.appendChild(tr);
        return;
      }

      rows.forEach(function (item) {
        var tr = document.createElement("tr");
        var q = document.createElement("td");
        q.style.whiteSpace = "normal";
        q.textContent = item.question;
        var t = document.createElement("td");
        t.style.whiteSpace = "nowrap";
        t.textContent = item.timeText;
        tr.appendChild(q);
        tr.appendChild(t);
        recentRows.appendChild(tr);
      });
    }

    function pushRecentQuestion(question) {
      var now = Date.now();
      state.recentQuestions.unshift({
        question: question,
        timeText: toNameTime(now),
        timestamp: now
      });
      if (state.recentQuestions.length > 40) {
        state.recentQuestions.length = 40;
      }
      var sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
      state.recentQuestions = state.recentQuestions.filter(function (item) { return item.timestamp >= sevenDaysAgo; });
      renderRecentRows();
    }

    function groupConfigEquals(a, b) {
      return JSON.stringify(normalizeSetting(a)) === JSON.stringify(normalizeSetting(b));
    }

    function initCompareGroups() {
      var first = getCurrentBaseSetting();
      state.compareGroups = [
        { id: uid("cmp"), name: "对比配置1", config: mergeSetting(first) },
        { id: uid("cmp"), name: "对比配置2", config: mergeSetting(first) }
      ];
      state.compareGroups[1].config.docTopK = clamp(state.compareGroups[1].config.docTopK + 2, 1, 20);
      state.compareGroups[1].config.docMatch = Number(Math.max(0.1, state.compareGroups[1].config.docMatch - 0.05).toFixed(2));
      renderCompareStrip();
      renderCompareActions();
    }

    function renderCompareStrip() {
      compareStrip.innerHTML = "";
      var list = state.compareMode ? state.compareGroups : [{ id: "base", name: "主配置", config: getCurrentBaseSetting() }];

      list.forEach(function (group, idx) {
        var chip = document.createElement("span");
        chip.className = "chip";
        var name = document.createElement("span");
        name.textContent = group.name;
        chip.appendChild(name);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "small-btn";
        btn.textContent = "设置";
        btn.dataset.group = group.id;
        btn.style.marginLeft = "4px";
        btn.addEventListener("click", function () {
          openCompareSetting(group.id, idx);
        });
        btn.disabled = !state.compareMode;
        chip.appendChild(btn);
        compareStrip.appendChild(chip);
      });
    }

    function renderCompareActions() {
      addCompareBtn.disabled = !state.compareMode || state.compareGroups.length >= 3;
      compareModeBtn.textContent = state.compareMode ? "退出对比测试" : "召回测试对比";
      globalRuleBtn.disabled = state.compareMode;
      openKbPicker.disabled = state.compareMode;
      if (state.compareMode) {
        compareWrap.classList.remove("hidden");
        showToast("已进入对比测试模式，知识库与基础设置已锁定");
      } else {
        showToast("已退出对比测试模式");
      }
    }

    function toggleCompareMode() {
      state.compareMode = !state.compareMode;
      if (state.compareMode) {
        if (state.selectedKbIds.length === 0) {
          showToast("请先选择至少1个知识库");
          state.compareMode = false;
          return;
        }
        initCompareGroups();
      } else {
        state.compareGroups = [];
      }
      renderCompareStrip();
      renderCompareActions();
      rerender();
    }

    function getCurrentBaseSetting() {
      var kbId = state.selectedKbIds[0];
      if (!kbId) return mergeSetting(state.baseSetting);
      return mergeSetting(state.kbConfigs[kbId]);
    }

    function getActiveGroupsForRun() {
      if (!state.compareMode) {
        return [{ id: "run-default", name: "召回结果", config: getCurrentBaseSetting() }];
      }
      return state.compareGroups.map(function (g, idx) {
        return {
          id: g.id,
          name: g.name + "（" + idx + 1 + "）",
          config: g.config
        };
      });
    }

    function getActiveSearchKbs() {
      if (!state.selectedKbIds.length) return [];
      return state.selectedKbIds.map(function (id) { return getKbById(id); }).filter(Boolean);
    }

    function randomScore(seed) {
      var v = (Math.sin(seed * 93.11) * 10000) % 1;
      if (v < 0) v = 1 + v;
      return Number((0.65 + v * 0.34).toFixed(2));
    }

    function makeResultItems(group, q, kbs, index) {
      var base = group.config.docTopK || 5;
      var n = clamp(Math.min(3, base), 1, 3);
      var items = [];
      for (var i = 0; i < n; i++) {
        var kbName = (kbs[i % kbs.length] || {}).name || "知识库";
        var seed = (q.length + i + index + kbName.length) * 11;
        items.push({
          title: kbName + " - 切片 " + (i + 1),
          source: "来源：" + kbName,
          score: randomScore(seed + i * 17),
          snippet: "基于当前配置返回的检索片段，建议核对是否覆盖“" + q + "”的核心语义与字段索引。"
        });
      }
      return items;
    }

    function renderResultCards(groups, q, kbs) {
      resultGrid.innerHTML = "";
      groups.forEach(function (group, groupIndex) {
        var card = document.createElement("section");
        card.className = "result-card";
        var head = document.createElement("div");
        head.className = "result-card-head";
        var h3 = document.createElement("div");
        h3.textContent = group.name;
        h3.style.fontWeight = "700";
        var meta = document.createElement("div");
        meta.style.color = "#8593a7";
        meta.style.fontSize = "11px";
        meta.textContent = "策略：" + (group.config.strategy === "hybrid" ? "混合检索" : "语义检索");
        head.appendChild(h3);
        head.appendChild(meta);

        var body = document.createElement("div");
        body.className = "result-card-body";
        var items = makeResultItems(group, q, kbs, groupIndex);
        if (!items.length) {
          var empty = document.createElement("div");
          empty.style.color = "#96a1b6";
          empty.style.fontSize = "12px";
          empty.textContent = "未召回到片段";
          body.appendChild(empty);
        } else {
          items.forEach(function (item) {
            var itemEl = document.createElement("div");
            itemEl.className = "recall-item";
            var line1 = document.createElement("div");
            line1.className = "recall-title";
            var t = document.createElement("span");
            t.textContent = item.title;
            var s = document.createElement("span");
            s.className = "recall-score";
            s.textContent = "score " + item.score;
            line1.appendChild(t);
            line1.appendChild(s);
            var line2 = document.createElement("div");
            line2.className = "recall-text";
            line2.textContent = item.source;
            var line3 = document.createElement("div");
            line3.className = "help";
            line3.style.margin = "0";
            line3.style.color = "#5d6b7d";
            line3.textContent = item.snippet;
            itemEl.appendChild(line1);
            itemEl.appendChild(line2);
            itemEl.appendChild(line3);
            body.appendChild(itemEl);
          });
        }
        card.appendChild(head);
        card.appendChild(body);
        resultGrid.appendChild(card);
      });
    }

    function addHistoryRecord(question, kbs, groups, groupResults) {
      state.history.unshift({
        id: uid("rec"),
        question: question || "（空问题）",
        time: Date.now(),
        timeText: toNameTime(Date.now()),
        kbNames: kbs.map(function (kb) { return kb.name; }).join("，"),
        groups: groups.length,
        resultCount: groupResults.reduce(function (sum, r) { return sum + r.length; }, 0)
      });
      if (state.history.length > 500) state.history.length = 500;
      renderHistory();
      showToast("测试已记录");
    }

    function renderHistory() {
      var kw = state.historyState.keyword.trim().toLowerCase();
      var filtered = state.history.filter(function (item) {
        if (!kw) return true;
        return item.question.toLowerCase().indexOf(kw) >= 0 || item.kbNames.toLowerCase().indexOf(kw) >= 0;
      });

      var total = filtered.length;
      var pageSize = Number(state.historyState.pageSize) || 10;
      var totalPage = Math.max(1, Math.ceil(total / pageSize));
      if (state.historyState.page > totalPage) state.historyState.page = totalPage;

      var start = (state.historyState.page - 1) * pageSize;
      var data = filtered.slice(start, start + pageSize);
      historyRows.innerHTML = "";

      if (data.length === 0) {
        historyEmpty.classList.remove("hidden");
      } else {
        historyEmpty.classList.add("hidden");
      }

      data.forEach(function (item) {
        var tr = document.createElement("tr");
        var q = document.createElement("td");
        q.style.maxWidth = "420px";
        q.textContent = item.question;
        var t = document.createElement("td");
        t.style.whiteSpace = "nowrap";
        t.textContent = item.timeText;
        var kb = document.createElement("td");
        kb.style.whiteSpace = "nowrap";
        kb.style.wordBreak = "keep-all";
        kb.textContent = item.kbNames || "未选择";
        var action = document.createElement("td");
        var view = document.createElement("button");
        view.type = "button";
        view.className = "small-btn";
        view.textContent = "查看详情";
        view.addEventListener("click", function () {
          showToast("查看记录：" + item.question);
        });
        action.appendChild(view);
        tr.appendChild(q);
        tr.appendChild(t);
        tr.appendChild(kb);
        tr.appendChild(action);
        historyRows.appendChild(tr);
      });

      renderHistoryPager(total, totalPage, pageSize);
    }

    function renderHistoryPager(total, totalPage, pageSize) {
      var prevDisabled = state.historyState.page <= 1 ? "disabled" : "";
      var nextDisabled = state.historyState.page >= totalPage ? "disabled" : "";

      historyPager.innerHTML =
        '<span>共' + total + '项</span>' +
        '<select id="historyPageSize" class="input" style="width:80px">' +
        [5, 10, 20, 30].map(function (size) {
          return '<option value="' + size + '"' + (size === pageSize ? " selected" : "") + '>' + size + '条/页</option>';
        }).join("") +
        '</select>' +
        '<button id="historyPrev" class="btn" ' + prevDisabled + '>上一页</button>' +
        '<span>第 ' + state.historyState.page + ' / ' + totalPage + ' 页</span>' +
        '<button id="historyNext" class="btn" ' + nextDisabled + '>下一页</button>' +
        '<span>前往</span>' +
        '<input id="historyGoto" class="input" style="width:56px" value="' + state.historyState.page + '" />' +
        '<button id="historyGo" class="btn">GO</button>';

      var sizeSel = $("historyPageSize");
      var prevBtn = $("historyPrev");
      var nextBtn = $("historyNext");
      var goto = $("historyGoto");
      var go = $("historyGo");

      sizeSel.addEventListener("change", function () {
        state.historyState.pageSize = Number(sizeSel.value);
        state.historyState.page = 1;
        renderHistory();
      });
      prevBtn.addEventListener("click", function () {
        if (state.historyState.page > 1) {
          state.historyState.page--;
          renderHistory();
        }
      });
      nextBtn.addEventListener("click", function () {
        if (state.historyState.page < totalPage) {
          state.historyState.page++;
          renderHistory();
        }
      });
      go.addEventListener("click", function () {
        var page = Number((goto.value || "").trim());
        if (isNaN(page) || page < 1) page = 1;
        if (page > totalPage) page = totalPage;
        state.historyState.page = page;
        renderHistory();
      });
    }

    function exportHistory() {
      var kw = state.historyState.keyword.trim().toLowerCase();
      var rows = state.history.filter(function (item) {
        if (!kw) return true;
        return item.question.toLowerCase().indexOf(kw) >= 0 || item.kbNames.toLowerCase().indexOf(kw) >= 0;
      });
      if (!rows.length) {
        showToast("暂无可导出的测试记录");
        return;
      }
      var csv = ["测试问题,查询时间,知识库,结果条数,配置组数"];
      rows.forEach(function (r) {
        var q = '"' + (r.question || "").replace(/"/g, '""') + '"';
        var k = '"' + (r.kbNames || "").replace(/"/g, '""') + '"';
        csv.push([q, r.timeText, k, r.resultCount, r.groups].join(","));
      });
      var blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "召回测试记录_" + Date.now() + ".csv";
      a.click();
      URL.revokeObjectURL(url);
      showToast("导出完成");
    }

    function clearHistory() {
      if (!state.history.length) {
        showToast("当前无测试记录");
        return;
      }
      if (!window.confirm("确认清空全部测试记录吗？")) return;
      state.history = [];
      state.historyState.page = 1;
      renderHistory();
      showToast("已清空测试记录");
    }

    function initSelect(cfg) {
      var wrap = $(cfg.wrapId);
      if (!wrap) return;
      var input = $(cfg.inputId);
      var trigger = wrap.querySelector(".search-select-trigger");
      var panel = wrap.querySelector(".search-select-panel");
      var search = $(cfg.searchId);
      var list = $(cfg.listId);

      function open(force) {
        var shouldOpen = force === true || !panel.classList.contains("show");
        if (!shouldOpen) {
          panel.classList.remove("show");
          return;
        }
        document.querySelectorAll(".search-select-panel").forEach(function (node) {
          if (node !== panel) node.classList.remove("show");
        });
        panel.classList.add("show");
        activeSelectPanel = panel;
        renderList("");
        search.value = "";
      }

      function setValue(val) {
        cfg.value = val || "";
        input.value = cfg.value;
        cfg.onChange(cfg.value);
        panel.classList.remove("show");
        activeSelectPanel = null;
      }

      function renderList(key) {
        var keyword = (key || "").toLowerCase();
        var filtered = cfg.options.filter(function (item) {
          return item.toLowerCase().indexOf(keyword) >= 0;
        });
        list.innerHTML = "";
        if (!filtered.length) {
          var empty = document.createElement("div");
          empty.className = "select-empty";
          empty.textContent = "无匹配项";
          list.appendChild(empty);
          return;
        }
        filtered.forEach(function (item) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "select-option";
          btn.textContent = item;
          btn.dataset.value = item;
          list.appendChild(btn);
        });
      }

      input.addEventListener("click", function () { open(); });
      trigger.addEventListener("click", function () { open(); });
      search.addEventListener("input", function () { renderList(search.value); });
      list.addEventListener("click", function (e) {
        var btn = e.target.closest(".select-option");
        if (!btn) return;
        setValue(btn.dataset.value);
      });

      cfg.render = renderList;
      cfg.input = input;
      cfg.search = search;
      cfg.panel = panel;
      cfg.wrap = wrap;
      input.value = cfg.value || "";
      renderList("");
    }

    function setRangeSync(rangeId, inputId, min, max, decimals, step, initial) {
      var range = $(rangeId);
      var num = $(inputId);
      var minus = document.querySelector('[data-step-control="' + rangeId.replace("Range", "") + '"][data-dir="-"]');
      var plus = document.querySelector('[data-step-control="' + rangeId.replace("Range", "") + '"][data-dir="+"]');

      function format(v) {
        return decimals ? Number(v).toFixed(2) : String(Math.round(v));
      }

      function set(v) {
        var parsed = Number(v);
        var val = decimals ? clamp(parsed, min, max).toFixed(2) : clamp(Math.round(parsed), min, max);
        range.value = String(val);
        num.value = format(val);
        return decimals ? Number(val) : Number(val);
      }

      if (num.value === "" || isNaN(Number(num.value))) set(initial);

      range.addEventListener("input", function () { set(range.value); });
      num.addEventListener("blur", function () {
        var next = set(num.value);
        num.value = format(next);
      });
      minus && minus.addEventListener("click", function () {
        set(Number(num.value || initial) - step);
      });
      plus && plus.addEventListener("click", function () {
        set(Number(num.value || initial) + step);
      });
      set(initial);
      return {
        set: set,
        value: function () { return decimals ? Number(Number(num.value).toFixed(2)) : Math.round(Number(num.value)); }
      };
    }

    function collectKbSettingForm() {
      var strategy = kbSettingModal.querySelector('input[name="strategy"]:checked').value;
      var nl2sql = nl2sqlInput.value || "";
      var rerankModel = rerankInput.value || "";
      return {
        strategy: strategy,
        nl2sql: nl2sql.trim(),
        excel: excelToggle.dataset.state === "on",
        rerank: rerankToggle.dataset.state === "on",
        rerankModel: rerankModel.trim(),
        docEnabled: docToggle.dataset.state === "on",
        docTopK: Number(docTopKNum.value),
        docMatch: Number(docMatchNum.value)
      };
    }

    function fillKbSettingForm(cfg) {
      var setting = normalizeSetting(cfg);
      var strategyRadio = kbSettingModal.querySelector('input[name="strategy"][value="' + setting.strategy + '"]');
      if (strategyRadio) strategyRadio.checked = true;
      nl2sqlInput.value = setting.nl2sql;
      rerankInput.value = setting.rerankModel;
      setToggle(excelToggle, excelToggleText, setting.excel);
      setToggle(rerankToggle, rerankToggleText, setting.rerank);
      setToggle(docToggle, docToggleText, setting.docEnabled);
      docTopKRange.value = String(setting.docTopK);
      docTopKNum.value = String(setting.docTopK);
      docMatchRange.value = String(setting.docMatch);
      docMatchNum.value = Number(setting.docMatch).toFixed(2);
      kbSettingErr.textContent = "";
      if (nl2sqlSearch && nl2sqlSearch.value) nl2sqlSearch.value = "";
      if (rerankSearch && rerankSearch.value) rerankSearch.value = "";
    }

    function openKbSettingByKb(kbId) {
      state.settingTarget = { type: "kb", id: kbId };
      var kb = getKbById(kbId);
      kbSettingTitle.textContent = "知识库检索设置（" + (kb ? kb.name : "知识库") + "）";
      fillKbSettingForm(state.kbConfigs[kbId] || state.baseSetting);
      openModal(kbSettingModal);
    }

    function openCompareSetting(groupId, idx) {
      if (!state.compareMode) {
        showToast("请先进入对比测试模式再设置各组配置");
        return;
      }
      var target = state.compareGroups.find(function (item) { return item.id === groupId; });
      if (!target) {
        showToast("未找到该对比组");
        return;
      }
      state.settingTarget = { type: "compare", id: groupId };
      kbSettingTitle.textContent = target.name + "（对比配置）";
      fillKbSettingForm(target.config || makeDefaultSetting());
      openModal(kbSettingModal);
    }

    function saveKbSettingHandler() {
      var next = normalizeSetting(collectKbSettingForm());
      if (!next.nl2sql || !next.rerankModel) {
        kbSettingErr.textContent = "NL2SQL模型和重排序模型为必填项";
        return;
      }
      if (state.settingTarget.type === "kb") {
        state.kbConfigs[state.settingTarget.id] = next;
        showToast("已保存知识库配置");
        closeModal(kbSettingModal);
        return;
      }
      if (state.settingTarget.type === "compare") {
        var idx;
        var target = null;
        for (var i = 0; i < state.compareGroups.length; i++) {
          if (state.compareGroups[i].id === state.settingTarget.id) {
            idx = i;
            target = state.compareGroups[i];
            break;
          }
        }
        if (!target) {
          showToast("对比配置未找到");
          closeModal(kbSettingModal);
          return;
        }
        for (var j = 0; j < state.compareGroups.length; j++) {
          if (j === idx) continue;
          if (groupConfigEquals(state.compareGroups[j].config, next)) {
            kbSettingErr.textContent = "该组配置与其他组重复，不能完全一致";
            return;
          }
        }
        target.config = next;
        renderCompareStrip();
        showToast("已保存该对比配置");
        closeModal(kbSettingModal);
      }
    }

    function renderKbPickerList() {
      var keyword = (kbPickerSearch.value || "").trim().toLowerCase();
      kbPickerList.innerHTML = "";
      var filtered = KB_POOL.filter(function (kb) {
        return kb.name.toLowerCase().indexOf(keyword) >= 0 || kb.desc.toLowerCase().indexOf(keyword) >= 0;
      });

      filtered.forEach(function (kb) {
        var item = document.createElement("label");
        item.className = "picker-item";
        var checked = state.selectedKbIds.indexOf(kb.id) >= 0;
        var disable = !checked && state.selectedKbIds.length >= 3;

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = kb.id;
        checkbox.checked = checked;
        checkbox.disabled = disable;

        var main = document.createElement("span");
        main.className = "picker-main";
        var name = document.createElement("div");
        name.className = "name";
        name.textContent = kb.name;
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = kb.desc;
        main.appendChild(name);
        main.appendChild(meta);

        item.appendChild(checkbox);
        item.appendChild(main);

        item.addEventListener("click", function (e) {
          if (e.target.tagName === "INPUT") return;
          if (checkbox.disabled) {
            e.preventDefault();
            showToast("最多可选择3个知识库");
            return;
          }
          checkbox.checked = !checkbox.checked;
        });
        kbPickerList.appendChild(item);
      });

      kbPickerCount.textContent = "已选择 " + state.selectedKbIds.length + " / 3";
    }

    function applyKbPickerSelection() {
      var next = [];
      var inputs = kbPickerList.querySelectorAll("input[type='checkbox']");
      inputs.forEach(function (input) {
        if (input.checked) next.push(input.value);
      });
      if (next.length > 3) {
        showToast("最多可选择3个知识库");
        return;
      }
      if (!next.length) {
        showToast("请至少选择1个知识库");
        return;
      }
      state.selectedKbIds = next;
      renderKbList();
      if (state.compareMode) {
        state.compareMode = false;
        renderCompareActions();
      }
      renderCompareStrip();
      closeModal(kbPickerModal);
      showToast("知识库选择已保存");
      rerender();
    }

    function renderGlobalSetting() {
      globalRerankInput.value = state.globalSetting.rerankModel || "";
      globalTopKRange.value = String(state.globalSetting.topK);
      globalTopKNum.value = String(state.globalSetting.topK);
    }

    function validateGlobalSetting() {
      if (!globalRerankInput.value) {
        showToast("重排序模型为必填项");
        return false;
      }
      state.globalSetting.rerankModel = globalRerankInput.value;
      state.globalSetting.topK = clamp(Number(globalTopKNum.value) || 10, 1, 50);
      return true;
    }

    function runRecall() {
      var kbs = getActiveSearchKbs();
      if (!kbs.length) {
        showToast("请先选择知识库");
        return;
      }
      var groups = getActiveGroupsForRun();
      if (state.compareMode && !groups.length) {
        showToast("请先完成对比配置");
        return;
      }
      if (state.compareMode) {
        var first = groups[0].config;
        for (var i = 1; i < groups.length; i++) {
          if (groupConfigEquals(groups[i].config, first)) {
            // allow if only 1组; for多组 ensure不同
            // 仅在运行时做防御提醒，避免无差异结果判断
          }
        }
      }

      var q = (questionInput.value || "").trim();
      if (!q) q = "默认测试问题";

      runBtn.disabled = true;
      recallLoading.style.display = "flex";
      recallEmpty.classList.add("hidden");
      resultGrid.innerHTML = "";

      setTimeout(function () {
        var grouped = groups.map(function (group) {
          return {
            name: group.name,
            config: group.config,
            results: makeResultItems(group, q, kbs, 0)
          };
        });
        renderResultCardsFromGroups(grouped, q, kbs);
        runBtn.disabled = false;
        recallLoading.style.display = "none";
        pushRecentQuestion(q);
        addHistoryRecord(q, kbs, groups, grouped.map(function (g) { return g.results; }));
      }, 450);
    }

    function renderResultCardsFromGroups(grouped, q, kbs) {
      resultGrid.innerHTML = "";
      grouped.forEach(function (g, idx) {
        var card = document.createElement("section");
        card.className = "result-card";
        var head = document.createElement("div");
        head.className = "result-card-head";
        head.innerHTML = "<div>" + safeText(g.name) + "</div><div style='color:#7486a2;font-size:11px'>策略：" + (g.config.strategy === "semantic" ? "语义检索" : "混合检索") + "</div>";

        var body = document.createElement("div");
        body.className = "result-card-body";
        if (!q) {
          var tip = document.createElement("div");
          tip.style.color = "#8b95a8";
          tip.style.fontSize = "12px";
          tip.textContent = "问题为空时按默认问题执行";
          body.appendChild(tip);
        }
        g.results.forEach(function (item) {
          var itemEl = document.createElement("article");
          itemEl.className = "recall-item";
          var top = document.createElement("div");
          top.className = "recall-title";
          var span1 = document.createElement("span");
          span1.textContent = item.title;
          var span2 = document.createElement("span");
          span2.className = "recall-score";
          span2.textContent = "score " + item.score;
          top.appendChild(span1);
          top.appendChild(span2);
          var desc = document.createElement("div");
          desc.className = "recall-text";
          desc.innerHTML = safeText(item.snippet);
          var from = document.createElement("div");
          from.className = "help";
          from.textContent = item.source;
          itemEl.appendChild(top);
          itemEl.appendChild(desc);
          itemEl.appendChild(from);
          body.appendChild(itemEl);
        });
        card.appendChild(head);
        card.appendChild(body);
        resultGrid.appendChild(card);
      });
      if (grouped.length === 0) {
        resultGrid.innerHTML = "";
        recallEmpty.classList.remove("hidden");
      } else {
        recallEmpty.classList.add("hidden");
      }
    }

    function switchTab(type) {
      tabRecall.classList.toggle("active", type === "recall");
      tabHistory.classList.toggle("active", type === "history");
      recallView.classList.toggle("show", type === "recall");
      historyView.classList.toggle("show", type === "history");
      if (type === "history") renderHistory();
      if (type === "recall") rerender();
    }

    function rerender() {
      renderKbList();
      renderRecentRows();
      renderCompareStrip();
      renderGlobalSetting();
      renderHistory();
      syncLeftPanel();
    }

    function bindSearchSelects() {
      initSelect({
        wrapId: "globalRerankSelect",
        inputId: "globalRerankInput",
        searchId: "globalRerankSearch",
        listId: "globalRerankList",
        options: RERANK_OPTIONS,
        value: state.globalSetting.rerankModel || RERANK_OPTIONS[0],
        onChange: function (v) { state.globalSetting.rerankModel = v; }
      });

      initSelect({
        wrapId: "nl2sqlSelect",
        inputId: "nl2sqlInput",
        searchId: "nl2sqlSearch",
        listId: "nl2sqlList",
        options: MODEL_OPTIONS,
        value: MODEL_OPTIONS[0],
        onChange: function () {}
      });
      initSelect({
        wrapId: "rerankSelect",
        inputId: "rerankInput",
        searchId: "rerankSearch",
        listId: "rerankList",
        options: RERANK_OPTIONS,
        value: RERANK_OPTIONS[0],
        onChange: function () {}
      });
    }

    function setupRangeFields() {
      setRangeSync("globalTopKRange", "globalTopKNum", 1, 50, false, 1, state.globalSetting.topK || 12);
      setRangeSync("docTopKRange", "docTopKNum", 1, 20, false, 1, 8);
      setRangeSync("docMatchRange", "docMatchNum", 0, 0.99, true, 0.01, 0.7);
    }

    function bindToggleSwitches() {
      initToggle(excelToggle, excelToggleText, true, function () {});
      initToggle(rerankToggle, rerankToggleText, true, function () {});
      initToggle(docToggle, docToggleText, true, function () {});
    }

    function setSearchMode() {
      var compare = state.compareMode ? "on" : "off";
      leftPanel.dataset.compare = compare;
      if (state.compareMode) {
        runBtn.textContent = "对比测试";
      } else {
        runBtn.textContent = "测试";
      }
      renderCompareActions();
      syncLeftPanel();
    }

    function bindEvents() {
      collapseLeft.addEventListener("click", function () {
        state.leftCollapsed = !state.leftCollapsed;
        syncLeftPanel();
      });

      runBtn.addEventListener("click", runRecall);
      compareModeBtn.addEventListener("click", toggleCompareMode);
      addCompareBtn.addEventListener("click", function () {
        if (!state.compareMode) {
          showToast("请先进入对比测试模式");
          return;
        }
        if (state.compareGroups.length >= 3) {
          showToast("最多可添加3组对比配置");
          return;
        }
        var base = state.compareGroups[0] ? mergeSetting(state.compareGroups[0].config) : getCurrentBaseSetting();
        var nextName = "对比配置" + (state.compareGroups.length + 1);
        state.compareGroups.push({ id: uid("cmp"), name: nextName, config: base });
        state.compareGroups[state.compareGroups.length - 1].config.docTopK = clamp(base.docTopK + 1, 1, 20);
        renderCompareStrip();
        renderCompareActions();
      });
      tabRecall.addEventListener("click", function () { switchTab("recall"); });
      tabHistory.addEventListener("click", function () { switchTab("history"); });
      exportBtn.addEventListener("click", exportHistory);
      clearBtn.addEventListener("click", clearHistory);
      historyExport.addEventListener("click", exportHistory);
      historyClear.addEventListener("click", clearHistory);
      historySearch.addEventListener("input", function () {
        state.historyState.keyword = historySearch.value || "";
        state.historyState.page = 1;
        renderHistory();
      });
      recentSearch.addEventListener("input", renderRecentRows);
      globalRuleBtn.addEventListener("click", function () {
        if (state.compareMode) {
          showToast("对比模式下基础设置不可修改");
          return;
        }
        openModal(globalRuleModal);
      });
      openKbPicker.addEventListener("click", function () {
        if (state.compareMode) {
          showToast("对比模式下知识库列表不可修改");
          return;
        }
        kbPickerSearch.value = "";
        renderKbPickerList();
        openModal(kbPickerModal);
      });

      [closeGlobalRule, cancelGlobalRule].forEach(function (btn) { btn.addEventListener("click", function () { closeModal(globalRuleModal); }); });
      [closeKbPicker, cancelKbPicker].forEach(function (btn) { btn.addEventListener("click", function () { closeModal(kbPickerModal); }); });
      [closeKbSetting, cancelKbSetting].forEach(function (btn) { btn.addEventListener("click", function () { closeModal(kbSettingModal); }); });

      saveGlobalRule.addEventListener("click", function () {
        if (!validateGlobalSetting()) return;
        showToast("检索召回设置已保存");
        closeModal(globalRuleModal);
      });
      saveKbPicker.addEventListener("click", applyKbPickerSelection);
      saveKbSetting.addEventListener("click", saveKbSettingHandler);

      kbPickerSearch.addEventListener("input", renderKbPickerList);

      backBtn.addEventListener("click", function () {
        if (window.top !== window && window.parent && window.parent.postMessage) {
          window.parent.postMessage({ type: "ebc-prototype-route", key: "knowledge" }, "*");
          return;
        }
        if (window.location.pathname.indexOf("/pages/") >= 0) {
          window.location.href = window.location.pathname.replace(/[^/]*$/, "EBC-Agent-Studio-知识管理中心-知识库.html");
          return;
        }
        if (window.location.hash) {
          window.location.hash = "knowledge";
          return;
        }
        window.location.href = "./EBC-Agent-Studio-知识管理中心-知识库.html";
      });

      document.addEventListener("click", function (e) {
        if (activeSelectPanel && !e.target.closest(".search-select")) {
          activeSelectPanel.classList.remove("show");
          activeSelectPanel = null;
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeAllModals();
      });

      [globalRuleModal, kbPickerModal, kbSettingModal].forEach(function (modal) {
        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal(modal);
        });
      });

      [globalTopKRange, docTopKRange, docMatchRange].forEach(function (r) {
        r.addEventListener("input", syncRangeAfterChange);
      });
    }

    function syncRangeAfterChange() {
      if (this === globalTopKRange) {
        globalTopKNum.value = String(this.value);
      }
      if (this === docTopKRange) {
        docTopKNum.value = String(this.value);
      }
      if (this === docMatchRange) {
        docMatchNum.value = Number(this.value).toFixed(2);
      }
    }

    function initCompareModeButtons() {
      state.compareMode = false;
      state.compareGroups = [];
      renderCompareStrip();
      setSearchMode();
    }

    function init() {
      state.selectedKbIds = state.selectedKbIds.filter(function (id) {
        return !!getKbById(id);
      }).slice(0, 3);
      if (state.selectedKbIds.length === 0) {
        state.selectedKbIds = ["kb_sales"];
      }

      bindSearchSelects();
      setupRangeFields();
      bindToggleSwitches();
      bindEvents();
      initCompareModeButtons();
      rerender();
      renderHistory();
      showToast("召回测试界面已加载");
    }

    init();
  })();
</script>
</body>
</html>
